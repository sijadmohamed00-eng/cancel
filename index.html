<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الإلغاءات - سحابة مشتركة</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #10132a;
    color: #eee;
    width: 160px;
    overflow: hidden;
    user-select: none;
  }

  .header {
    background: linear-gradient(135deg, #1B52C4, #0d3a8a);
    padding: 5px 7px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: move;
    border-bottom: 1px solid #4A9EFF33;
  }

  .header-title { font-size: 10px; font-weight: 700; color: #fff; }

  .body {
    padding: 6px 6px 5px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  label {
    font-size: 9px;
    color: #4A9EFF;
    font-weight: 600;
    display: block;
    margin-bottom: 1px;
  }

  input[type="text"], select {
    width: 100%;
    background: #0a1228;
    border: 1px solid #1B52C444;
    border-radius: 4px;
    color: #fff;
    font-size: 10.5px;
    padding: 4px 5px;
    outline: none;
    font-family: inherit;
    direction: rtl;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus, select:focus { border-color: #4A9EFF; }

  select option { background: #0a1228; }

  .custom-reason { display: none; margin-top: 3px; }
  .custom-reason.visible { display: block; }

  .btn-send {
    width: 100%;
    background: linear-gradient(135deg, #1B52C4, #4A9EFF);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 6px;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 2px;
    font-family: inherit;
    transition: opacity 0.15s;
  }

  .btn-send:active { opacity: 0.8; }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-report {
    width: 100%;
    background: transparent;
    color: #4A9EFF;
    border: 1px solid #4A9EFF55;
    border-radius: 5px;
    padding: 4px;
    font-size: 9.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-report:hover { background: #4A9EFF11; }

  .counter {
    text-align: center;
    font-size: 9px;
    color: #4A9EFF99;
    padding: 1px 0;
  }

  .sync-status {
    text-align: center;
    font-size: 8px;
    color: #4A9EFF66;
    padding: 1px 0;
    cursor: pointer;
  }
  .sync-status.synced { color: #16a34a; }
  .sync-status.error { color: #ef4444; }
  .sync-status.syncing { color: #f59e0b; }

  .toast {
    position: fixed;
    bottom: 5px;
    left: 4px;
    right: 4px;
    background: #16a34a;
    color: #fff;
    font-size: 10px;
    text-align: center;
    padding: 5px 4px;
    border-radius: 5px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 99;
  }

  .toast.show { opacity: 1; }
  .toast.error { background: #dc2626; }

  hr { border: none; border-top: 1px solid #1B52C422; margin: 2px 0; }
</style>
</head>
<body>

<div class="header" id="drag-handle">
  <span class="header-title">🚫 تسجيل إلغاء</span>
  <span style="font-size:10px">☁️</span>
</div>

<div class="body">

  <div>
    <label>رقم الأوردر *</label>
    <input type="text" id="order-num" placeholder="مثال: 284" inputmode="numeric">
  </div>

  <div>
    <label>رقم الزبون</label>
    <input type="text" id="phone-num" placeholder="07xxxxxxxxx" inputmode="tel">
  </div>

  <div>
    <label>الفرع *</label>
    <select id="branch">
      <option value="">— اختر الفرع —</option>
      <option>فرع الشعب</option>
      <option>فرع البنوك</option>
      <option>فرع الغدير</option>
      <option>فرع الحرية</option>
      <option>فرع الدورة</option>
      <option>فرع بسماية</option>
      <option>فرع الغزالية</option>
      <option>فرع الأعظمية</option>
      <option>فرع حي العامل</option>
      <option>فرع البوعيثة</option>
      <option>فرع حي الجهاد</option>
      <option>فرع شهداء البياع</option>
    </select>
  </div>

  <div>
    <label>سبب الإلغاء *</label>
    <select id="reason" onchange="toggleCustom()">
      <option value="">— اختر السبب —</option>
      <option>زبون</option>
      <option>تكرار</option>
      <option>تحويل</option>
      <option>عدم رد</option>
      <option>خارج الزون</option>
      <option value="مخصص">مخصص ✏️</option>
    </select>
    <div class="custom-reason" id="custom-wrap">
      <input type="text" id="custom-reason-txt" placeholder="اكتب السبب...">
    </div>
  </div>

  <hr>

  <button class="btn-send" id="send-btn" onclick="sendEntry()">📋 حفظ + نسخ للواتساب</button>
  <div class="counter" id="counter">الإلغاءات اليوم: 0</div>
  <div class="sync-status" id="sync-status" onclick="syncFromCloud()">☁️ متزامن</div>
  <button class="btn-report" onclick="openReport()">📊 فتح التقرير</button>

</div>

<div class="toast" id="toast">✅ تم الحفظ والنسخ!</div>

<script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js"
    }
  }
</script>

<script type="module">
  import { initializeApp } from "firebase/app";
  import { 
    getDatabase, 
    ref, 
    set, 
    get, 
    push,
    onValue,
    off,
    query,
    orderByChild,
    limitToLast,
    serverTimestamp
  } from "firebase/database";

  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCBnLWtMPJBHF55yCZvjZJu34LMtTxc1u0",
    authDomain: "cansel-9df25.firebaseapp.com",
    projectId: "cansel-9df25",
    storageBucket: "cansel-9df25.firebasestorage.app",
    messagingSenderId: "1056776938370",
    appId: "1:1056776938370:web:79c3d830fc2f37debfa59b",
    databaseURL: "https://cansel-9df25-default-rtdb.firebaseio.com/"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);
  
  const STORAGE_KEY = 'cancel_entries_rtdb_v1';
  let currentEntries = [];
  let databaseListener = null;
  
  // Helper functions
  function getTodayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  
  function getTodayPath() {
    return `cancellations/${getTodayKey()}`;
  }
  
  function loadLocal() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        const parsed = JSON.parse(data);
        return parsed[getTodayKey()] || [];
      }
      return [];
    } catch { return []; }
  }
  
  function saveLocal(entries) {
    try {
      const all = {};
      all[getTodayKey()] = entries;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
      currentEntries = entries;
    } catch {}
  }
  
  function updateCounter() {
    document.getElementById('counter').textContent = `الإلغاءات اليوم: ${currentEntries.length}`;
  }
  
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg || (isError ? '❌ حدث خطأ' : '✅ تم الحفظ والنسخ!');
    if (isError) t.classList.add('error');
    else t.classList.remove('error');
    t.classList.add('show');
    setTimeout(() => {
      t.classList.remove('show');
      if (!isError) t.textContent = '✅ تم الحفظ والنسخ!';
    }, 2200);
  }
  
  function updateSyncStatus(status, isError = false) {
    const statusEl = document.getElementById('sync-status');
    if (status === 'synced') {
      statusEl.textContent = '☁️ متزامن ✓';
      statusEl.classList.add('synced');
      statusEl.classList.remove('error', 'syncing');
    } else if (status === 'syncing') {
      statusEl.textContent = '☁️ جاري...';
      statusEl.classList.add('syncing');
      statusEl.classList.remove('synced', 'error');
    } else if (status === 'error') {
      statusEl.textContent = '☁️ غير متزامن';
      statusEl.classList.add('error');
      statusEl.classList.remove('synced', 'syncing');
    } else {
      statusEl.textContent = '☁️ متصل';
      statusEl.classList.remove('synced', 'error', 'syncing');
    }
  }
  
  // Listen to realtime updates from Firebase
  function listenToRealtimeUpdates() {
    if (databaseListener) {
      off(databaseListener);
    }
    
    const todayPath = getTodayPath();
    const entriesRef = ref(database, todayPath);
    
    databaseListener = onValue(entriesRef, (snapshot) => {
      const cloudData = snapshot.val();
      let cloudEntries = [];
      
      if (cloudData) {
        // Convert object to array
        cloudEntries = Object.entries(cloudData).map(([id, entry]) => ({
          ...entry,
          id: parseInt(id) || entry.id
        })).sort((a, b) => (a.timestamp || a.id) - (b.timestamp || b.id));
      }
      
      const localEntries = loadLocal();
      
      // Merge: cloud takes precedence
      const mergedMap = new Map();
      cloudEntries.forEach(entry => mergedMap.set(entry.id, entry));
      localEntries.forEach(entry => {
        if (!mergedMap.has(entry.id)) mergedMap.set(entry.id, entry);
      });
      
      const mergedEntries = Array.from(mergedMap.values()).sort((a,b) => a.id - b.id);
      
      // Only update if changed
      if (JSON.stringify(mergedEntries) !== JSON.stringify(currentEntries)) {
        saveLocal(mergedEntries);
        currentEntries = mergedEntries;
        updateCounter();
        updateSyncStatus('synced');
      }
    }, (error) => {
      console.error('Realtime listener error:', error);
      updateSyncStatus('error', true);
    });
  }
  
  // Sync from cloud manually
  window.syncFromCloud = async function() {
    updateSyncStatus('syncing');
    
    try {
      const todayPath = getTodayPath();
      const entriesRef = ref(database, todayPath);
      const snapshot = await get(entriesRef);
      
      let cloudEntries = [];
      if (snapshot.exists()) {
        const data = snapshot.val();
        cloudEntries = Object.entries(data).map(([id, entry]) => ({
          ...entry,
          id: parseInt(id) || entry.id
        })).sort((a, b) => a.id - b.id);
      }
      
      const localEntries = loadLocal();
      const mergedMap = new Map();
      
      cloudEntries.forEach(entry => mergedMap.set(entry.id, entry));
      localEntries.forEach(entry => {
        if (!mergedMap.has(entry.id)) mergedMap.set(entry.id, entry);
      });
      
      const mergedEntries = Array.from(mergedMap.values()).sort((a,b) => a.id - b.id);
      saveLocal(mergedEntries);
      currentEntries = mergedEntries;
      updateCounter();
      updateSyncStatus('synced');
      showToast('✅ تمت المزامنة مع السحابة', false);
    } catch (err) {
      console.error('Sync error:', err);
      updateSyncStatus('error', true);
      showToast('⚠️ فشل الاتصال بالسحابة', true);
    }
  };
  
  // Upload single entry to Firebase
  async function uploadEntryToFirebase(entry) {
    try {
      const todayPath = getTodayPath();
      // Use entry ID as the key for easy updates
      const entryRef = ref(database, `${todayPath}/${entry.id}`);
      await set(entryRef, {
        ...entry,
        syncedAt: serverTimestamp()
      });
      return true;
    } catch (err) {
      console.error('Upload error:', err);
      return false;
    }
  }
  
  // Upload all entries to Firebase (batch sync)
  async function uploadAllToFirebase(entries) {
    try {
      const todayPath = getTodayPath();
      const updates = {};
      entries.forEach(entry => {
        updates[`${todayPath}/${entry.id}`] = {
          ...entry,
          syncedAt: serverTimestamp()
        };
      });
      
      // Use ref and set for each or batch write
      for (const entry of entries) {
        const entryRef = ref(database, `${todayPath}/${entry.id}`);
        await set(entryRef, {
          ...entry,
          syncedAt: serverTimestamp()
        });
      }
      return true;
    } catch (err) {
      console.error('Batch upload error:', err);
      return false;
    }
  }
  
  window.toggleCustom = function() {
    const sel = document.getElementById('reason');
    document.getElementById('custom-wrap').classList.toggle('visible', sel.value === 'مخصص');
  };
  
  window.sendEntry = async function() {
    const order  = document.getElementById('order-num').value.trim();
    const phone  = document.getElementById('phone-num').value.trim();
    const branch = document.getElementById('branch').value;
    const sel    = document.getElementById('reason');
    const reason = sel.value === 'مخصص'
      ? document.getElementById('custom-reason-txt').value.trim()
      : sel.value;
  
    if (!order || !branch || !reason) {
      showToast('⚠️ رقم الأوردر والفرع والسبب مطلوبة', true);
      return;
    }
  
    const now = new Date();
    const timeStr = now.toLocaleTimeString('ar-IQ', {hour:'2-digit', minute:'2-digit'});
    const entry = {
      id: Date.now(),
      order: order,
      phone: phone || '',
      branch: branch,
      reason: reason,
      time: timeStr,
      timestamp: now.toISOString(),
      createdAt: now.getTime()
    };
  
    const btn = document.getElementById('send-btn');
    const originalText = btn.textContent;
    btn.textContent = '⏳ جاري الحفظ...';
    btn.disabled = true;
  
    try {
      // Save to local first (optimistic)
      const newEntries = [...currentEntries, entry];
      saveLocal(newEntries);
      currentEntries = newEntries;
      updateCounter();
      
      // Try to upload to Firebase
      const uploaded = await uploadEntryToFirebase(entry);
      
      if (!uploaded) {
        updateSyncStatus('error', true);
        showToast('⚠️ تم الحفظ محلياً (لا يوجد اتصال)', true);
      } else {
        updateSyncStatus('synced');
      }
      
      // Build WhatsApp message
      const msg = `🚫 إلغاء أوردر\n📦 رقم الأوردر: ${order}\n${phone ? `📞 رقم الزبون: ${phone}\n` : ''}🏪 الفرع: ${branch}\n❌ السبب: ${reason}\n⏰ الوقت: ${timeStr}`;
      
      // Copy to clipboard
      await navigator.clipboard.writeText(msg);
      
      const syncMsg = uploaded ? '' : ' (حفظ محلي فقط)';
      showToast(`✅ تم الحفظ والنسخ${syncMsg}`, !uploaded);
      
      // Reset fields
      document.getElementById('order-num').value = '';
      document.getElementById('phone-num').value = '';
      document.getElementById('branch').value = '';
      document.getElementById('reason').value = '';
      document.getElementById('custom-reason-txt').value = '';
      document.getElementById('custom-wrap').classList.remove('visible');
      document.getElementById('order-num').focus();
      
    } catch (err) {
      console.error('Send error:', err);
      showToast('❌ فشل الحفظ', true);
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  };
  
  window.openReport = function() {
    // Store current entries for report
    localStorage.setItem('report_data_rtdb', JSON.stringify(currentEntries));
    window.open('report.html', '_blank', 'width=800,height=600');
  };
  
  // Sync local unsynced entries on reconnect
  async function syncPendingEntries() {
    if (!navigator.onLine) return;
    
    const localEntries = loadLocal();
    if (localEntries.length === 0) return;
    
    updateSyncStatus('syncing');
    try {
      const todayPath = getTodayPath();
      const snapshot = await get(ref(database, todayPath));
      
      const existingIds = new Set();
      if (snapshot.exists()) {
        const data = snapshot.val();
        Object.keys(data).forEach(key => existingIds.add(parseInt(key)));
      }
      
      // Upload only entries that don't exist in cloud
      const missingEntries = localEntries.filter(entry => !existingIds.has(entry.id));
      
      if (missingEntries.length > 0) {
        await uploadAllToFirebase(missingEntries);
        updateSyncStatus('synced');
        showToast(`✅ تمت مزامنة ${missingEntries.length} إلغاءات`, false);
      } else {
        updateSyncStatus('synced');
      }
    } catch (err) {
      console.error('Sync pending error:', err);
      updateSyncStatus('error', true);
    }
  }
  
  // Initialize
  function init() {
    currentEntries = loadLocal();
    updateCounter();
    listenToRealtimeUpdates();
    
    // Sync pending on load
    setTimeout(() => syncPendingEntries(), 1000);
  }
  
  // Network listeners
  window.addEventListener('online', () => {
    showToast('🌐 تم الاتصال بالإنترنت، جاري المزامنة', false);
    syncPendingEntries();
  });
  
  window.addEventListener('offline', () => {
    updateSyncStatus('error', true);
    showToast('⚠️ لا يوجد اتصال بالإنترنت - سيتم الحفظ محلياً', true);
  });
  
  // Start
  init();
  
  // Auto sync every 60 seconds
  setInterval(() => {
    if (navigator.onLine) {
      syncPendingEntries();
    }
  }, 60000);
</script>

</body>
</html>
