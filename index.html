<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الإلغاءات</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #10132a;
    color: #eee;
    width: 170px;
    overflow: hidden;
    user-select: none;
  }

  /* Always on Top - عبر CSS (لكن JavaScript أفضل للتحكم الكامل) */
  
  .header {
    background: linear-gradient(135deg, #1B52C4, #0d3a8a);
    padding: 6px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: move;
    border-bottom: 1px solid #4A9EFF33;
    -webkit-app-region: drag; /* للسحب في التطبيقات */
  }

  .header-title { font-size: 10px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 5px; }
  
  .pin-btn {
    background: transparent;
    border: none;
    color: #fff;
    cursor: pointer;
    font-size: 11px;
    padding: 0 3px;
    opacity: 0.7;
    -webkit-app-region: no-drag;
  }
  .pin-btn.active { opacity: 1; color: #f59e0b; }
  .pin-btn:hover { opacity: 1; }

  .body {
    padding: 6px 6px 5px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  label {
    font-size: 9px;
    color: #4A9EFF;
    font-weight: 600;
    display: block;
    margin-bottom: 1px;
  }

  input[type="text"], select {
    width: 100%;
    background: #0a1228;
    border: 1px solid #1B52C444;
    border-radius: 4px;
    color: #fff;
    font-size: 10.5px;
    padding: 4px 5px;
    outline: none;
    font-family: inherit;
    direction: rtl;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus, select:focus { border-color: #4A9EFF; }

  select option { background: #0a1228; }

  .custom-reason { display: none; margin-top: 3px; }
  .custom-reason.visible { display: block; }

  .btn-send {
    width: 100%;
    background: linear-gradient(135deg, #1B52C4, #4A9EFF);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 6px;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 2px;
    font-family: inherit;
    transition: opacity 0.15s;
  }

  .btn-send:active { opacity: 0.8; }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-admin {
    width: 100%;
    background: transparent;
    color: #f59e0b;
    border: 1px solid #f59e0b55;
    border-radius: 5px;
    padding: 4px;
    font-size: 9.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-top: 3px;
  }

  .btn-admin:hover { background: #f59e0b11; }

  .counter {
    text-align: center;
    font-size: 9px;
    color: #4A9EFF99;
    padding: 1px 0;
  }

  .sync-status {
    text-align: center;
    font-size: 8px;
    color: #4A9EFF66;
    padding: 1px 0;
    cursor: pointer;
  }
  .sync-status.synced { color: #16a34a; }
  .sync-status.error { color: #ef4444; }

  .toast {
    position: fixed;
    bottom: 5px;
    left: 4px;
    right: 4px;
    background: #16a34a;
    color: #fff;
    font-size: 10px;
    text-align: center;
    padding: 5px 4px;
    border-radius: 5px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 9999;
  }

  .toast.show { opacity: 1; }
  .toast.error { background: #dc2626; }

  hr { border: none; border-top: 1px solid #1B52C422; margin: 2px 0; }
  
  /* Admin Panel (مخفي إلا للأدمن) */
  .admin-panel {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #0a0e1aee;
    backdrop-filter: blur(5px);
    z-index: 10000;
    padding: 15px;
    overflow-y: auto;
  }
  .admin-panel.show { display: block; }
  .admin-content {
    background: #10132a;
    border-radius: 12px;
    padding: 15px;
    max-width: 500px;
    margin: 0 auto;
    border: 1px solid #4A9EFF;
  }
  .admin-content h3 { margin-bottom: 10px; color: #4A9EFF; }
  .admin-content button {
    background: #1B52C4;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    margin: 5px;
    cursor: pointer;
  }
  .admin-content .close-btn { background: #dc2626; }
  .admin-password {
    width: 100%;
    padding: 8px;
    margin: 10px 0;
    background: #0a1228;
    border: 1px solid #1B52C4;
    border-radius: 6px;
    color: #fff;
  }
</style>
</head>
<body>

<div class="header" id="drag-handle">
  <div class="header-title">
    <span>🚫 تسجيل إلغاء</span>
  </div>
  <div>
    <button class="pin-btn" id="pinBtn" onclick="toggleAlwaysOnTop()" title="تثبيت فوق النوافذ">📌</button>
  </div>
</div>

<div class="body">
  <div>
    <label>رقم الأوردر *</label>
    <input type="text" id="order-num" placeholder="مثال: 284" inputmode="numeric">
  </div>
  <div>
    <label>رقم الزبون</label>
    <input type="text" id="phone-num" placeholder="07xxxxxxxxx" inputmode="tel">
  </div>
  <div>
    <label>الفرع *</label>
    <select id="branch">
      <option value="">— اختر الفرع —</option>
      <option>فرع الشعب</option>
      <option>فرع البنوك</option>
      <option>فرع الغدير</option>
      <option>فرع الحرية</option>
      <option>فرع الدورة</option>
      <option>فرع بسماية</option>
      <option>فرع الغزالية</option>
      <option>فرع الأعظمية</option>
      <option>فرع حي العامل</option>
      <option>فرع البوعيثة</option>
      <option>فرع حي الجهاد</option>
      <option>فرع شهداء البياع</option>
    </select>
  </div>
  <div>
    <label>سبب الإلغاء *</label>
    <select id="reason" onchange="toggleCustom()">
      <option value="">— اختر السبب —</option>
      <option>زبون</option>
      <option>تكرار</option>
      <option>تحويل</option>
      <option>عدم رد</option>
      <option>خارج الزون</option>
      <option value="مخصص">مخصص ✏️</option>
    </select>
    <div class="custom-reason" id="custom-wrap">
      <input type="text" id="custom-reason-txt" placeholder="اكتب السبب...">
    </div>
  </div>
  <hr>
  <button class="btn-send" id="send-btn" onclick="sendEntry()">📋 حفظ + نسخ</button>
  <div class="counter" id="counter">الإلغاءات اليوم: 0</div>
  <div class="sync-status" id="sync-status" onclick="syncFromCloud()">☁️ متزامن</div>
  <button class="btn-admin" onclick="showAdminPanel()">👑 لوحة الأدمن</button>
</div>

<div class="toast" id="toast">✅ تم الحفظ والنسخ!</div>

<!-- Admin Panel -->
<div id="adminPanel" class="admin-panel">
  <div class="admin-content">
    <h3>👑 لوحة التحكم - الأدمن</h3>
    <input type="password" id="adminPass" class="admin-password" placeholder="كلمة المرور">
    <button onclick="checkAdminAndLoad()">🔓 دخول</button>
    <div id="adminActions" style="display: none; margin-top: 15px;">
      <button onclick="generateWordReport()">📄 تصدير تقرير Word (كل الأفرع)</button>
      <button onclick="generateWordReportByBranch()">📁 تصدير تقرير Word (كل فرع بمفرده)</button>
      <button onclick="copyAllToClipboard()">📋 نسخ كل الإلغاءات</button>
      <button onclick="clearAllData()" style="background:#dc2626;">⚠️ حذف كل البيانات</button>
      <hr style="margin: 10px 0;">
      <button onclick="closeAdminPanel()" class="close-btn">❌ إغلاق</button>
    </div>
  </div>
</div>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCBnLWtMPJBHF55yCZvjZJu34LMtTxc1u0",
    authDomain: "cansel-9df25.firebaseapp.com",
    projectId: "cansel-9df25",
    storageBucket: "cansel-9df25.firebasestorage.app",
    messagingSenderId: "1056776938370",
    appId: "1:1056776938370:web:79c3d830fc2f37debfa59b",
    databaseURL: "https://cansel-9df25-default-rtdb.firebaseio.com/"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  
  const STORAGE_KEY = 'cancel_entries_v4';
  let currentEntries = [];
  let isPinned = false;
  
  function getTodayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  
  function getTodayPath() {
    return `cancellations/${getTodayKey()}`;
  }
  
  function loadLocal() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        const parsed = JSON.parse(data);
        return parsed[getTodayKey()] || [];
      }
      return [];
    } catch { return []; }
  }
  
  function saveLocal(entries) {
    try {
      const all = {};
      all[getTodayKey()] = entries;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
      currentEntries = entries;
      sessionStorage.setItem('current_cancel_entries', JSON.stringify(entries));
    } catch {}
  }
  
  function updateCounter() {
    document.getElementById('counter').textContent = `الإلغاءات اليوم: ${currentEntries.length}`;
    sessionStorage.setItem('current_cancel_entries', JSON.stringify(currentEntries));
  }
  
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg || (isError ? '❌ حدث خطأ' : '✅ تم الحفظ والنسخ!');
    if (isError) t.classList.add('error');
    else t.classList.remove('error');
    t.classList.add('show');
    setTimeout(() => {
      t.classList.remove('show');
      if (!isError) t.textContent = '✅ تم الحفظ والنسخ!';
    }, 2200);
  }
  
  function updateSyncStatus(status) {
    const statusEl = document.getElementById('sync-status');
    if (status === 'synced') {
      statusEl.textContent = '☁️ متزامن ✓';
      statusEl.classList.add('synced');
      statusEl.classList.remove('error');
    } else if (status === 'error') {
      statusEl.textContent = '☁️ غير متزامن';
      statusEl.classList.add('error');
      statusEl.classList.remove('synced');
    }
  }
  
  // Always on Top functionality
  window.toggleAlwaysOnTop = function() {
    isPinned = !isPinned;
    const pinBtn = document.getElementById('pinBtn');
    if (isPinned) {
      pinBtn.classList.add('active');
      pinBtn.textContent = '📍';
      showToast('📌 تم التثبيت فوق النوافذ', false);
      // Note: Requires Electron or native app for true always-on-top
      // For browser, we use a workaround with popup window
      if (window.electronAPI) {
        window.electronAPI.setAlwaysOnTop(true);
      } else {
        // Create a standalone window
        const win = window.open(window.location.href, 'CancelApp', 
          'width=190,height=450,toolbar=no,menubar=no,location=no,status=no,alwaysOnTop=yes');
        if (win) {
          win.focus();
          showToast('🪟 تم فتح نافذة منفصلة - ثبتها يدوياً', false);
        }
      }
    } else {
      pinBtn.classList.remove('active');
      pinBtn.textContent = '📌';
      if (window.electronAPI) {
        window.electronAPI.setAlwaysOnTop(false);
      }
    }
  };
  
  // Listen to realtime updates
  function listenToRealtimeUpdates() {
    const todayPath = getTodayPath();
    const entriesRef = database.ref(todayPath);
    
    entriesRef.on('value', (snapshot) => {
      const cloudData = snapshot.val();
      let cloudEntries = [];
      
      if (cloudData && typeof cloudData === 'object') {
        cloudEntries = Object.entries(cloudData).map(([id, entry]) => ({
          ...entry,
          id: parseInt(id) || entry.id || id
        })).sort((a, b) => (a.createdAt || a.id) - (b.createdAt || b.id));
      }
      
      const localEntries = loadLocal();
      const mergedMap = new Map();
      cloudEntries.forEach(entry => mergedMap.set(entry.id, entry));
      localEntries.forEach(entry => {
        if (!mergedMap.has(entry.id)) mergedMap.set(entry.id, entry);
      });
      
      const mergedEntries = Array.from(mergedMap.values()).sort((a,b) => a.id - b.id);
      
      if (JSON.stringify(mergedEntries) !== JSON.stringify(currentEntries)) {
        saveLocal(mergedEntries);
        currentEntries = mergedEntries;
        updateCounter();
        updateSyncStatus('synced');
      }
    }, (error) => {
      console.error('Realtime error:', error);
      updateSyncStatus('error');
    });
  }
  
  window.syncFromCloud = async function() {
    try {
      const todayPath = getTodayPath();
      const snapshot = await database.ref(todayPath).once('value');
      
      let cloudEntries = [];
      if (snapshot.exists()) {
        const data = snapshot.val();
        cloudEntries = Object.entries(data).map(([id, entry]) => ({
          ...entry,
          id: parseInt(id) || entry.id || id
        })).sort((a, b) => a.id - b.id);
      }
      
      const localEntries = loadLocal();
      const mergedMap = new Map();
      cloudEntries.forEach(entry => mergedMap.set(entry.id, entry));
      localEntries.forEach(entry => {
        if (!mergedMap.has(entry.id)) mergedMap.set(entry.id, entry);
      });
      
      const mergedEntries = Array.from(mergedMap.values()).sort((a,b) => a.id - b.id);
      saveLocal(mergedEntries);
      currentEntries = mergedEntries;
      updateCounter();
      updateSyncStatus('synced');
      showToast('✅ تمت المزامنة', false);
    } catch (err) {
      console.error('Sync error:', err);
      updateSyncStatus('error');
      showToast('⚠️ فشل الاتصال', true);
    }
  };
  
  async function uploadEntryToFirebase(entry) {
    try {
      const todayPath = getTodayPath();
      await database.ref(`${todayPath}/${entry.id}`).set({
        ...entry,
        syncedAt: firebase.database.ServerValue.TIMESTAMP
      });
      return true;
    } catch (err) {
      console.error('Upload error:', err);
      return false;
    }
  }
  
  window.toggleCustom = function() {
    const sel = document.getElementById('reason');
    document.getElementById('custom-wrap').classList.toggle('visible', sel.value === 'مخصص');
  };
  
  window.sendEntry = async function() {
    const order  = document.getElementById('order-num').value.trim();
    const phone  = document.getElementById('phone-num').value.trim();
    const branch = document.getElementById('branch').value;
    const sel    = document.getElementById('reason');
    const reason = sel.value === 'مخصص'
      ? document.getElementById('custom-reason-txt').value.trim()
      : sel.value;
  
    if (!order || !branch || !reason) {
      showToast('⚠️ الأوردر والفرع والسبب مطلوبة', true);
      return;
    }
  
    const now = new Date();
    const timeStr = now.toLocaleTimeString('ar-IQ', {hour:'2-digit', minute:'2-digit'});
    const entry = {
      id: Date.now(),
      order: order,
      phone: phone || '',
      branch: branch,
      reason: reason,
      time: timeStr,
      createdAt: now.getTime(),
      date: getTodayKey()
    };
  
    const btn = document.getElementById('send-btn');
    const originalText = btn.textContent;
    btn.textContent = '⏳ جاري...';
    btn.disabled = true;
  
    try {
      const newEntries = [...currentEntries, entry];
      saveLocal(newEntries);
      currentEntries = newEntries;
      updateCounter();
      
      const uploaded = await uploadEntryToFirebase(entry);
      
      if (!uploaded) {
        updateSyncStatus('error');
        showToast('⚠️ تم الحفظ محلياً', true);
      } else {
        updateSyncStatus('synced');
      }
      
      const msg = `🚫 إلغاء أوردر\n📦 رقم الأوردر: ${order}\n${phone ? `📞 رقم الزبون: ${phone}\n` : ''}🏪 الفرع: ${branch}\n❌ السبب: ${reason}\n⏰ الوقت: ${timeStr}`;
      await navigator.clipboard.writeText(msg);
      
      showToast(`✅ تم الحفظ والنسخ`, false);
      
      document.getElementById('order-num').value = '';
      document.getElementById('phone-num').value = '';
      document.getElementById('branch').value = '';
      document.getElementById('reason').value = '';
      document.getElementById('custom-reason-txt').value = '';
      document.getElementById('custom-wrap').classList.remove('visible');
      document.getElementById('order-num').focus();
      
    } catch (err) {
      console.error('Send error:', err);
      showToast('❌ فشل الحفظ', true);
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  };
  
  // Admin Functions
  window.showAdminPanel = function() {
    document.getElementById('adminPanel').classList.add('show');
  };
  
  window.closeAdminPanel = function() {
    document.getElementById('adminPanel').classList.remove('show');
    document.getElementById('adminActions').style.display = 'none';
    document.getElementById('adminPass').value = '';
  };
  
  window.checkAdminAndLoad = function() {
    const pass = document.getElementById('adminPass').value;
    // Change this password as needed
    if (pass === 'admin123') {
      document.getElementById('adminActions').style.display = 'block';
      showToast('✅ مرحباً أيها الأدمن', false);
    } else {
      showToast('❌ كلمة المرور غير صحيحة', true);
    }
  };
  
  // Generate Word Report - Each branch separately
  window.generateWordReportByBranch = function() {
    const entries = currentEntries;
    if (entries.length === 0) {
      showToast('لا توجد بيانات للتصدير', true);
      return;
    }
    
    // Group by branch
    const grouped = {};
    entries.forEach(entry => {
      if (!grouped[entry.branch]) grouped[entry.branch] = [];
      grouped[entry.branch].push(entry);
    });
    
    const today = getTodayKey();
    const dateStr = new Date().toLocaleDateString('ar-IQ');
    
    let fullHtml = `
      <!DOCTYPE html>
      <html dir="rtl">
      <head>
        <meta charset="UTF-8">
        <title>تقرير الإلغاءات - ${today}</title>
        <style>
          body { font-family: Arial, sans-serif; margin: 20px; background: white; color: black; }
          .header { text-align: center; margin-bottom: 30px; }
          .header h1 { color: #1B52C4; }
          .branch-section { margin-bottom: 40px; page-break-inside: avoid; }
          .branch-title { background: #1B52C4; color: white; padding: 10px; border-radius: 8px; }
          table { width: 100%; border-collapse: collapse; margin-top: 15px; }
          th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
          th { background: #f2f2f2; }
          .footer { margin-top: 30px; text-align: center; font-size: 12px; color: #666; }
        </style>
      </head>
      <body>
        <div class="header">
          <h1>📊 تقرير الإلغاءات</h1>
          <p>شركة عصر الشرق - قسم خدمة العملاء</p>
          <p>التاريخ: ${dateStr}</p>
        </div>
    `;
    
    for (const [branch, branchEntries] of Object.entries(grouped)) {
      fullHtml += `
        <div class="branch-section">
          <div class="branch-title">
            <h3>🏪 ${branch}</h3>
            <p>عدد الإلغاءات: ${branchEntries.length}</p>
          </div>
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>رقم الأوردر</th>
                <th>رقم الزبون</th>
                <th>سبب الإلغاء</th>
                <th>الوقت</th>
              </tr>
            </thead>
            <tbody>
      `;
      branchEntries.forEach((entry, idx) => {
        fullHtml += `
          <tr>
            <td>${idx + 1}</td>
            <td>${entry.order}</td>
            <td dir="ltr">${entry.phone || '—'}</td>
            <td>${entry.reason}</td>
            <td>${entry.time}</td>
          </tr>
        `;
      });
      fullHtml += `
            </tbody>
          </table>
        </div>
      `;
    }
    
    fullHtml += `
        <div class="footer">
          <p>إجمالي الإلغاءات: ${entries.length}</p>
          <p>تم التصدير بتاريخ: ${new Date().toLocaleString('ar-IQ')}</p>
        </div>
      </body>
      </html>
    `;
    
    const blob = new Blob([fullHtml], { type: 'application/msword' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.download = `تقرير_الإلغاءات_${today}.doc`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    
    showToast('✅ تم تصدير التقرير بنجاح', false);
  };
  
  window.generateWordReport = function() {
    generateWordReportByBranch();
  };
  
  window.copyAllToClipboard = function() {
    if (currentEntries.length === 0) {
      showToast('لا توجد بيانات', true);
      return;
    }
    
    let text = `📊 تقرير الإلغاءات - ${getTodayKey()}\n`;
    text += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
    
    const grouped = {};
    currentEntries.forEach(entry => {
      if (!grouped[entry.branch]) grouped[entry.branch] = [];
      grouped[entry.branch].push(entry);
    });
    
    for (const [branch, entries] of Object.entries(grouped)) {
      text += `🏪 ${branch}\n`;
      text += `┌─────┬──────────┬────────────────┬──────────────┐\n`;
      text += `│  #  │ الأوردر  │   رقم الزبون   │    السبب     │\n`;
      text += `├─────┼──────────┼────────────────┼──────────────┤\n`;
      entries.forEach((entry, idx) => {
        const phone = entry.phone.padEnd(14);
        text += `│ ${(idx+1).toString().padEnd(3)} │ ${entry.order.padEnd(8)} │ ${phone} │ ${entry.reason.padEnd(12)} │\n`;
      });
      text += `└─────┴──────────┴────────────────┴──────────────┘\n\n`;
    }
    
    text += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
    text += `📦 إجمالي الإلغاءات: ${currentEntries.length}\n`;
    text += `📅 التاريخ: ${new Date().toLocaleDateString('ar-IQ')}\n`;
    
    navigator.clipboard.writeText(text);
    showToast('✅ تم نسخ كل الإلغاءات', false);
  };
  
  window.clearAllData = function() {
    if (confirm('⚠️ تحذير: هل أنت متأكد من حذف كل بيانات اليوم؟')) {
      saveLocal([]);
      currentEntries = [];
      updateCounter();
      const todayPath = getTodayPath();
      database.ref(todayPath).remove().then(() => {
        showToast('✅ تم حذف كل البيانات', false);
      }).catch(() => {
        showToast('⚠️ تم الحذف محلياً فقط', true);
      });
    }
  };
  
  // Initialize
  currentEntries = loadLocal();
  updateCounter();
  listenToRealtimeUpdates();
  setTimeout(() => window.syncFromCloud(), 2000);
  
  window.addEventListener('online', () => {
    showToast('🌐 تم الاتصال بالإنترنت', false);
    window.syncFromCloud();
  });
  
  window.addEventListener('offline', () => {
    updateSyncStatus('error');
    showToast('⚠️ لا يوجد اتصال بالإنترنت', true);
  });
</script>

<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js"></script>
