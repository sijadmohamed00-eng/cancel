<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الإلغاءات</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #10132a;
    color: #eee;
    width: 160px;
    overflow: hidden;
    user-select: none;
  }

  .header {
    background: linear-gradient(135deg, #1B52C4, #0d3a8a);
    padding: 5px 7px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: move;
    border-bottom: 1px solid #4A9EFF33;
  }

  .header-title { font-size: 10px; font-weight: 700; color: #fff; }

  .body {
    padding: 6px 6px 5px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  label {
    font-size: 9px;
    color: #4A9EFF;
    font-weight: 600;
    display: block;
    margin-bottom: 1px;
  }

  input[type="text"], select {
    width: 100%;
    background: #0a1228;
    border: 1px solid #1B52C444;
    border-radius: 4px;
    color: #fff;
    font-size: 10.5px;
    padding: 4px 5px;
    outline: none;
    font-family: inherit;
    direction: rtl;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus, select:focus { border-color: #4A9EFF; }

  select option { background: #0a1228; }

  .custom-reason { display: none; margin-top: 3px; }
  .custom-reason.visible { display: block; }

  .btn-send {
    width: 100%;
    background: linear-gradient(135deg, #1B52C4, #4A9EFF);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 6px;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 2px;
    font-family: inherit;
    transition: opacity 0.15s;
  }

  .btn-send:active { opacity: 0.8; }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-report {
    width: 100%;
    background: transparent;
    color: #4A9EFF;
    border: 1px solid #4A9EFF55;
    border-radius: 5px;
    padding: 4px;
    font-size: 9.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-report:hover { background: #4A9EFF11; }

  .counter {
    text-align: center;
    font-size: 9px;
    color: #4A9EFF99;
    padding: 1px 0;
  }

  .sync-status {
    text-align: center;
    font-size: 8px;
    color: #4A9EFF66;
    padding: 1px 0;
    cursor: pointer;
  }
  .sync-status.synced { color: #16a34a; }
  .sync-status.error { color: #ef4444; }
  .sync-status.syncing { color: #f59e0b; }

  .toast {
    position: fixed;
    bottom: 5px;
    left: 4px;
    right: 4px;
    background: #16a34a;
    color: #fff;
    font-size: 10px;
    text-align: center;
    padding: 5px 4px;
    border-radius: 5px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 99;
  }

  .toast.show { opacity: 1; }
  .toast.error { background: #dc2626; }

  hr { border: none; border-top: 1px solid #1B52C422; margin: 2px 0; }
</style>
</head>
<body>

<div class="header" id="drag-handle">
  <span class="header-title">🚫 تسجيل إلغاء</span>
  <span style="font-size:10px">☁️</span>
</div>

<div class="body">

  <div>
    <label>رقم الأوردر *</label>
    <input type="text" id="order-num" placeholder="مثال: 284" inputmode="numeric">
  </div>

  <div>
    <label>رقم الزبون</label>
    <input type="text" id="phone-num" placeholder="07xxxxxxxxx" inputmode="tel">
  </div>

  <div>
    <label>الفرع *</label>
    <select id="branch">
      <option value="">— اختر الفرع —</option>
      <option>فرع الشعب</option>
      <option>فرع البنوك</option>
      <option>فرع الغدير</option>
      <option>فرع الحرية</option>
      <option>فرع الدورة</option>
      <option>فرع بسماية</option>
      <option>فرع الغزالية</option>
      <option>فرع الأعظمية</option>
      <option>فرع حي العامل</option>
      <option>فرع البوعيثة</option>
      <option>فرع حي الجهاد</option>
      <option>فرع شهداء البياع</option>
    </select>
  </div>

  <div>
    <label>سبب الإلغاء *</label>
    <select id="reason" onchange="toggleCustom()">
      <option value="">— اختر السبب —</option>
      <option>زبون</option>
      <option>تكرار</option>
      <option>تحويل</option>
      <option>عدم رد</option>
      <option>خارج الزون</option>
      <option value="مخصص">مخصص ✏️</option>
    </select>
    <div class="custom-reason" id="custom-wrap">
      <input type="text" id="custom-reason-txt" placeholder="اكتب السبب...">
    </div>
  </div>

  <hr>

  <button class="btn-send" id="send-btn" onclick="sendEntry()">📋 حفظ + نسخ للواتساب</button>
  <div class="counter" id="counter">الإلغاءات اليوم: 0</div>
  <div class="sync-status" id="sync-status" onclick="syncFromCloud()">☁️ متزامن</div>
  <button class="btn-report" onclick="openReport()">📊 فتح التقرير</button>

</div>

<div class="toast" id="toast">✅ تم الحفظ والنسخ!</div>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCBnLWtMPJBHF55yCZvjZJu34LMtTxc1u0",
    authDomain: "cansel-9df25.firebaseapp.com",
    projectId: "cansel-9df25",
    storageBucket: "cansel-9df25.firebasestorage.app",
    messagingSenderId: "1056776938370",
    appId: "1:1056776938370:web:79c3d830fc2f37debfa59b",
    databaseURL: "https://cansel-9df25-default-rtdb.firebaseio.com/"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  
  const STORAGE_KEY = 'cancel_entries_v3';
  let currentEntries = [];
  
  function getTodayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  
  function getTodayPath() {
    return `cancellations/${getTodayKey()}`;
  }
  
  function loadLocal() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        const parsed = JSON.parse(data);
        return parsed[getTodayKey()] || [];
      }
      return [];
    } catch { return []; }
  }
  
  function saveLocal(entries) {
    try {
      const all = {};
      all[getTodayKey()] = entries;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
      currentEntries = entries;
      sessionStorage.setItem('current_cancel_entries', JSON.stringify(entries));
    } catch {}
  }
  
  function updateCounter() {
    document.getElementById('counter').textContent = `الإلغاءات اليوم: ${currentEntries.length}`;
    sessionStorage.setItem('current_cancel_entries', JSON.stringify(currentEntries));
  }
  
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg || (isError ? '❌ حدث خطأ' : '✅ تم الحفظ والنسخ!');
    if (isError) t.classList.add('error');
    else t.classList.remove('error');
    t.classList.add('show');
    setTimeout(() => {
      t.classList.remove('show');
      if (!isError) t.textContent = '✅ تم الحفظ والنسخ!';
    }, 2200);
  }
  
  function updateSyncStatus(status) {
    const statusEl = document.getElementById('sync-status');
    if (status === 'synced') {
      statusEl.textContent = '☁️ متزامن ✓';
      statusEl.classList.add('synced');
      statusEl.classList.remove('error');
    } else if (status === 'error') {
      statusEl.textContent = '☁️ غير متزامن';
      statusEl.classList.add('error');
      statusEl.classList.remove('synced');
    }
  }
  
  // Listen to realtime updates
  function listenToRealtimeUpdates() {
    const todayPath = getTodayPath();
    const entriesRef = database.ref(todayPath);
    
    entriesRef.on('value', (snapshot) => {
      const cloudData = snapshot.val();
      let cloudEntries = [];
      
      if (cloudData && typeof cloudData === 'object') {
        cloudEntries = Object.entries(cloudData).map(([id, entry]) => ({
          ...entry,
          id: parseInt(id) || entry.id || id
        })).sort((a, b) => (a.createdAt || a.id) - (b.createdAt || b.id));
      }
      
      const localEntries = loadLocal();
      const mergedMap = new Map();
      cloudEntries.forEach(entry => mergedMap.set(entry.id, entry));
      localEntries.forEach(entry => {
        if (!mergedMap.has(entry.id)) mergedMap.set(entry.id, entry);
      });
      
      const mergedEntries = Array.from(mergedMap.values()).sort((a,b) => a.id - b.id);
      
      if (JSON.stringify(mergedEntries) !== JSON.stringify(currentEntries)) {
        saveLocal(mergedEntries);
        currentEntries = mergedEntries;
        updateCounter();
        updateSyncStatus('synced');
      }
    }, (error) => {
      console.error('Realtime error:', error);
      updateSyncStatus('error');
    });
  }
  
  window.syncFromCloud = async function() {
    updateSyncStatus('syncing');
    
    try {
      const todayPath = getTodayPath();
      const snapshot = await database.ref(todayPath).once('value');
      
      let cloudEntries = [];
      if (snapshot.exists()) {
        const data = snapshot.val();
        cloudEntries = Object.entries(data).map(([id, entry]) => ({
          ...entry,
          id: parseInt(id) || entry.id || id
        })).sort((a, b) => a.id - b.id);
      }
      
      const localEntries = loadLocal();
      const mergedMap = new Map();
      cloudEntries.forEach(entry => mergedMap.set(entry.id, entry));
      localEntries.forEach(entry => {
        if (!mergedMap.has(entry.id)) mergedMap.set(entry.id, entry);
      });
      
      const mergedEntries = Array.from(mergedMap.values()).sort((a,b) => a.id - b.id);
      saveLocal(mergedEntries);
      currentEntries = mergedEntries;
      updateCounter();
      updateSyncStatus('synced');
      showToast('✅ تمت المزامنة مع السحابة', false);
    } catch (err) {
      console.error('Sync error:', err);
      updateSyncStatus('error');
      showToast('⚠️ فشل الاتصال بالسحابة', true);
    }
  };
  
  async function uploadEntryToFirebase(entry) {
    try {
      const todayPath = getTodayPath();
      await database.ref(`${todayPath}/${entry.id}`).set({
        ...entry,
        syncedAt: firebase.database.ServerValue.TIMESTAMP
      });
      return true;
    } catch (err) {
      console.error('Upload error:', err);
      return false;
    }
  }
  
  window.toggleCustom = function() {
    const sel = document.getElementById('reason');
    document.getElementById('custom-wrap').classList.toggle('visible', sel.value === 'مخصص');
  };
  
  window.sendEntry = async function() {
    const order  = document.getElementById('order-num').value.trim();
    const phone  = document.getElementById('phone-num').value.trim();
    const branch = document.getElementById('branch').value;
    const sel    = document.getElementById('reason');
    const reason = sel.value === 'مخصص'
      ? document.getElementById('custom-reason-txt').value.trim()
      : sel.value;
  
    if (!order || !branch || !reason) {
      showToast('⚠️ رقم الأوردر والفرع والسبب مطلوبة', true);
      return;
    }
  
    const now = new Date();
    const timeStr = now.toLocaleTimeString('ar-IQ', {hour:'2-digit', minute:'2-digit'});
    const entry = {
      id: Date.now(),
      order: order,
      phone: phone || '',
      branch: branch,
      reason: reason,
      time: timeStr,
      createdAt: now.getTime(),
      date: getTodayKey()
    };
  
    const btn = document.getElementById('send-btn');
    const originalText = btn.textContent;
    btn.textContent = '⏳ جاري الحفظ...';
    btn.disabled = true;
  
    try {
      const newEntries = [...currentEntries, entry];
      saveLocal(newEntries);
      currentEntries = newEntries;
      updateCounter();
      
      const uploaded = await uploadEntryToFirebase(entry);
      
      if (!uploaded) {
        updateSyncStatus('error');
        showToast('⚠️ تم الحفظ محلياً (لا يوجد اتصال)', true);
      } else {
        updateSyncStatus('synced');
      }
      
      const msg = `🚫 إلغاء أوردر\n📦 رقم الأوردر: ${order}\n${phone ? `📞 رقم الزبون: ${phone}\n` : ''}🏪 الفرع: ${branch}\n❌ السبب: ${reason}\n⏰ الوقت: ${timeStr}`;
      
      await navigator.clipboard.writeText(msg);
      
      const syncMsg = uploaded ? '' : ' (حفظ محلي فقط)';
      showToast(`✅ تم الحفظ والنسخ${syncMsg}`, !uploaded);
      
      document.getElementById('order-num').value = '';
      document.getElementById('phone-num').value = '';
      document.getElementById('branch').value = '';
      document.getElementById('reason').value = '';
      document.getElementById('custom-reason-txt').value = '';
      document.getElementById('custom-wrap').classList.remove('visible');
      document.getElementById('order-num').focus();
      
    } catch (err) {
      console.error('Send error:', err);
      showToast('❌ فشل الحفظ', true);
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  };
  
  window.openReport = function() {
    sessionStorage.setItem('current_cancel_entries', JSON.stringify(currentEntries));
    sessionStorage.setItem('report_date', getTodayKey());
    window.open('report.html', '_blank', 'width=900,height=700');
  };
  
  // Initialize
  currentEntries = loadLocal();
  updateCounter();
  listenToRealtimeUpdates();
  setTimeout(() => window.syncFromCloud(), 2000);
  
  window.addEventListener('online', () => {
    showToast('🌐 تم الاتصال بالإنترنت، جاري المزامنة', false);
    window.syncFromCloud();
  });
  
  window.addEventListener('offline', () => {
    updateSyncStatus('error');
    showToast('⚠️ لا يوجد اتصال بالإنترنت - سيتم الحفظ محلياً', true);
  });
</script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js"></script>

</body>
</html>
