<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الإلغاءات</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #10132a;
    color: #eee;
    width: 180px;
    overflow: hidden;
    user-select: none;
  }
  .header {
    background: linear-gradient(135deg, #1B52C4, #0d3a8a);
    padding: 6px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: move;
  }
  .header-title { font-size: 10px; font-weight: 700; }
  .pin-btn {
    background: transparent;
    border: none;
    color: #fff;
    cursor: pointer;
    font-size: 11px;
  }
  .body { padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  label { font-size: 9px; color: #4A9EFF; display: block; margin-bottom: 1px; }
  input, select {
    width: 100%;
    background: #0a1228;
    border: 1px solid #1B52C444;
    border-radius: 4px;
    color: #fff;
    font-size: 10px;
    padding: 4px;
    font-family: inherit;
    direction: rtl;
  }
  .custom-reason { display: none; margin-top: 3px; }
  .custom-reason.visible { display: block; }
  .btn-send {
    width: 100%;
    background: linear-gradient(135deg, #1B52C4, #4A9EFF);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 6px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 3px;
  }
  .btn-admin {
    width: 100%;
    background: transparent;
    color: #f59e0b;
    border: 1px solid #f59e0b55;
    border-radius: 5px;
    padding: 4px;
    font-size: 9px;
    cursor: pointer;
    margin-top: 3px;
  }
  .counter {
    text-align: center;
    font-size: 9px;
    color: #4A9EFF99;
    padding: 2px 0;
  }
  .sync-status {
    text-align: center;
    font-size: 8px;
    color: #4A9EFF66;
    cursor: pointer;
  }
  .sync-status.synced { color: #16a34a; }
  .sync-status.error { color: #ef4444; }
  .sync-status.syncing { color: #f59e0b; }
  .toast {
    position: fixed;
    bottom: 5px;
    left: 4px;
    right: 4px;
    background: #16a34a;
    font-size: 9px;
    text-align: center;
    padding: 4px;
    border-radius: 5px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 9999;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: #dc2626; }
  hr { margin: 3px 0; border: none; border-top: 1px solid #1B52C422; }
  
  .admin-panel {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #0a0e1aee;
    backdrop-filter: blur(5px);
    z-index: 10000;
    padding: 15px;
  }
  .admin-panel.show { display: block; }
  .admin-content {
    background: #10132a;
    border-radius: 12px;
    padding: 15px;
    border: 1px solid #4A9EFF;
  }
  .admin-content h3 { margin-bottom: 10px; color: #4A9EFF; font-size: 14px; }
  .admin-content button {
    background: #1B52C4;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    margin: 3px;
    cursor: pointer;
    font-size: 11px;
  }
  .admin-content .close-btn { background: #dc2626; }
  .admin-password {
    width: 100%;
    padding: 6px;
    margin: 8px 0;
    background: #0a1228;
    border: 1px solid #1B52C4;
    border-radius: 6px;
    color: #fff;
  }
</style>
</head>
<body>

<div class="header" id="drag-handle">
  <div class="header-title">🚫 تسجيل إلغاء</div>
  <button class="pin-btn" onclick="toggleAlwaysOnTop()">📌</button>
</div>

<div class="body">
  <div>
    <label>رقم الأوردر *</label>
    <input type="text" id="order-num" placeholder="مثال: 284">
  </div>
  <div>
    <label>رقم الزبون</label>
    <input type="text" id="phone-num" placeholder="07xxxxxxxxx">
  </div>
  <div>
    <label>الفرع *</label>
    <select id="branch">
      <option value="">— اختر الفرع —</option>
      <option>فرع الشعب</option>
      <option>فرع البنوك</option>
      <option>فرع الغدير</option>
      <option>فرع الحرية</option>
      <option>فرع الدورة</option>
      <option>فرع بسماية</option>
      <option>فرع الغزالية</option>
      <option>فرع الأعظمية</option>
      <option>فرع حي العامل</option>
      <option>فرع البوعيثة</option>
      <option>فرع حي الجهاد</option>
      <option>فرع شهداء البياع</option>
    </select>
  </div>
  <div>
    <label>سبب الإلغاء *</label>
    <select id="reason" onchange="toggleCustom()">
      <option value="">— اختر السبب —</option>
      <option>زبون</option>
      <option>تكرار</option>
      <option>تحويل</option>
      <option>عدم رد</option>
      <option>خارج الزون</option>
      <option value="مخصص">مخصص ✏️</option>
    </select>
    <div class="custom-reason" id="custom-wrap">
      <input type="text" id="custom-reason-txt" placeholder="اكتب السبب...">
    </div>
  </div>
  <hr>
  <button class="btn-send" onclick="sendEntry()">📋 حفظ + نسخ</button>
  <div class="counter" id="counter">الإلغاءات اليوم: 0</div>
  <div class="sync-status" id="sync-status" onclick="syncFromCloud()">☁️ متزامن</div>
  <button class="btn-admin" onclick="showAdminPanel()">👑 لوحة الأدمن</button>
</div>

<div class="toast" id="toast">✅ تم الحفظ والنسخ!</div>

<div id="adminPanel" class="admin-panel">
  <div class="admin-content">
    <h3>👑 لوحة التحكم</h3>
    <input type="password" id="adminPass" class="admin-password" placeholder="كلمة المرور">
    <button onclick="checkAdmin()">🔓 دخول</button>
    <div id="adminActions" style="display: none; margin-top: 10px;">
      <button onclick="generateWordReport()">📄 تصدير تقرير Word</button>
      <button onclick="copyAllToClipboard()">📋 نسخ الكل</button>
      <button onclick="clearAllData()" style="background:#dc2626;">⚠️ حذف الكل</button>
      <hr>
      <button onclick="closeAdminPanel()" class="close-btn">❌ إغلاق</button>
    </div>
  </div>
</div>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyCBnLWtMPJBHF55yCZvjZJu34LMtTxc1u0",
    authDomain: "cansel-9df25.firebaseapp.com",
    projectId: "cansel-9df25",
    databaseURL: "https://cansel-9df25-default-rtdb.firebaseio.com/"
  };
  
  let database;
  let currentEntries = [];
  let isOnline = true;
  
  function getTodayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  
  function loadLocal() {
    try {
      const key = `cancel_${getTodayKey()}`;
      const saved = localStorage.getItem(key);
      return saved ? JSON.parse(saved) : [];
    } catch(e) { return []; }
  }
  
  function saveLocal(entries) {
    try {
      const key = `cancel_${getTodayKey()}`;
      localStorage.setItem(key, JSON.stringify(entries));
      currentEntries = entries;
      updateCounter();
    } catch(e) { console.error("Save error:", e); }
  }
  
  function updateCounter() {
    document.getElementById('counter').textContent = `الإلغاءات اليوم: ${currentEntries.length}`;
  }
  
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    if (isError) t.classList.add('error');
    else t.classList.remove('error');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
  
  function setSyncStatus(status) {
    const el = document.getElementById('sync-status');
    if (status === 'synced') {
      el.textContent = '☁️ متزامن ✓';
      el.classList.add('synced');
      el.classList.remove('error', 'syncing');
    } else if (status === 'syncing') {
      el.textContent = '☁️ جاري المزامنة...';
      el.classList.add('syncing');
      el.classList.remove('synced', 'error');
    } else if (status === 'error') {
      el.textContent = '☁️ غير متزامن';
      el.classList.add('error');
      el.classList.remove('synced', 'syncing');
    }
  }
  
  window.toggleCustom = function() {
    const sel = document.getElementById('reason');
    document.getElementById('custom-wrap').classList.toggle('visible', sel.value === 'مخصص');
  };
  
  window.toggleAlwaysOnTop = function() {
    const btn = document.querySelector('.pin-btn');
    btn.classList.toggle('active');
    if (btn.classList.contains('active')) {
      btn.textContent = '📍';
      showToast('📌 تم فتح نافذة منفصلة', false);
      window.open(window.location.href, '_blank', 'width=200,height=480,toolbar=no,menubar=no,location=no,status=no');
    } else {
      btn.textContent = '📌';
    }
  };
  
  async function uploadToFirebase(entry) {
    if (!database) return false;
    try {
      const path = `cancellations/${getTodayKey()}/${entry.id}`;
      await database.ref(path).set(entry);
      return true;
    } catch(e) {
      console.error("Upload error:", e);
      return false;
    }
  }
  
  window.sendEntry = async function() {
    const order = document.getElementById('order-num').value.trim();
    const phone = document.getElementById('phone-num').value.trim();
    const branch = document.getElementById('branch').value;
    const reasonSelect = document.getElementById('reason');
    let reason = reasonSelect.value;
    
    if (reason === 'مخصص') {
      reason = document.getElementById('custom-reason-txt').value.trim();
    }
    
    if (!order) { showToast('⚠️ رقم الأوردر مطلوب', true); return; }
    if (!branch) { showToast('⚠️ الفرع مطلوب', true); return; }
    if (!reason) { showToast('⚠️ السبب مطلوب', true); return; }
    
    const now = new Date();
    const timeStr = now.toLocaleTimeString('ar-IQ', {hour:'2-digit', minute:'2-digit'});
    
    const entry = {
      id: Date.now(),
      order: order,
      phone: phone || '',
      branch: branch,
      reason: reason,
      time: timeStr,
      date: getTodayKey(),
      createdAt: now.getTime()
    };
    
    // Save to local first
    const newEntries = [...currentEntries, entry];
    saveLocal(newEntries);
    
    setSyncStatus('syncing');
    
    // Try to upload to Firebase
    const uploaded = await uploadToFirebase(entry);
    
    if (uploaded) {
      setSyncStatus('synced');
      showToast(`✅ تم حفظ ${order}`, false);
    } else {
      setSyncStatus('error');
      showToast(`⚠️ تم حفظ ${order} محلياً فقط`, true);
    }
    
    // Copy to clipboard
    const msg = `🚫 إلغاء أوردر\n📦 رقم الأوردر: ${order}\n${phone ? `📞 رقم الزبون: ${phone}\n` : ''}🏪 الفرع: ${branch}\n❌ السبب: ${reason}\n⏰ الوقت: ${timeStr}`;
    
    try {
      await navigator.clipboard.writeText(msg);
    } catch(e) {
      const ta = document.createElement('textarea');
      ta.value = msg;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    
    // Clear form
    document.getElementById('order-num').value = '';
    document.getElementById('phone-num').value = '';
    document.getElementById('branch').value = '';
    document.getElementById('reason').value = '';
    document.getElementById('custom-reason-txt').value = '';
    document.getElementById('custom-wrap').classList.remove('visible');
    document.getElementById('order-num').focus();
  };
  
  window.syncFromCloud = async function() {
    if (!database) {
      showToast('⚠️ لا يوجد اتصال بقاعدة البيانات', true);
      return;
    }
    
    setSyncStatus('syncing');
    
    try {
      const snapshot = await database.ref(`cancellations/${getTodayKey()}`).once('value');
      if (snapshot.exists()) {
        const data = snapshot.val();
        const cloudEntries = Object.values(data);
        const merged = [...currentEntries];
        cloudEntries.forEach(cloudEntry => {
          if (!merged.find(e => e.id === cloudEntry.id)) {
            merged.push(cloudEntry);
          }
        });
        merged.sort((a,b) => a.id - b.id);
        saveLocal(merged);
        showToast('✅ تمت المزامنة', false);
        setSyncStatus('synced');
      } else {
        // Upload all local entries to cloud
        for (const entry of currentEntries) {
          await uploadToFirebase(entry);
        }
        setSyncStatus('synced');
        showToast('✅ تم رفع البيانات للسحابة', false);
      }
    } catch(e) {
      console.error("Sync error:", e);
      setSyncStatus('error');
      showToast('⚠️ فشل الاتصال بالسحابة', true);
    }
  };
  
  // Admin Functions
  window.showAdminPanel = function() {
    document.getElementById('adminPanel').classList.add('show');
  };
  
  window.closeAdminPanel = function() {
    document.getElementById('adminPanel').classList.remove('show');
    document.getElementById('adminActions').style.display = 'none';
    document.getElementById('adminPass').value = '';
  };
  
  window.checkAdmin = function() {
    const pass = document.getElementById('adminPass').value;
    if (pass === 'admin123') {
      document.getElementById('adminActions').style.display = 'block';
      showToast('✅ مرحباً أيها الأدمن', false);
    } else {
      showToast('❌ كلمة المرور غير صحيحة', true);
    }
  };
  
  window.generateWordReport = function() {
    if (currentEntries.length === 0) {
      showToast('لا توجد بيانات للتصدير', true);
      return;
    }
    
    const grouped = {};
    currentEntries.forEach(entry => {
      if (!grouped[entry.branch]) grouped[entry.branch] = [];
      grouped[entry.branch].push(entry);
    });
    
    let html = `<!DOCTYPE html>
    <html dir="rtl">
    <head><meta charset="UTF-8"><title>تقرير الإلغاءات</title>
    <style>
      body { font-family: Arial; margin: 20px; }
      h1 { color: #1B52C4; text-align: center; }
      .branch { margin-bottom: 30px; }
      .branch h2 { background: #1B52C4; color: white; padding: 8px; border-radius: 5px; }
      table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
      th { background: #f2f2f2; }
    </style>
    </head>
    <body>
    <h1>📊 تقرير الإلغاءات</h1>
    <p style="text-align:center">التاريخ: ${new Date().toLocaleDateString('ar-IQ')}</p>`;
    
    for (const [branch, entries] of Object.entries(grouped)) {
      html += `<div class="branch">
        <h2>🏪 ${branch} (${entries.length})</h2>
        <table><thead><tr><th>#</th><th>رقم الأوردر</th><th>رقم الزبون</th><th>السبب</th><th>الوقت</th></tr></thead><tbody>`;
      entries.forEach((e, i) => {
        html += `<tr><td>${i+1}</td><td>${e.order}</td><td>${e.phone || '—'}</td><td>${e.reason}</td><td>${e.time}</td></tr>`;
      });
      html += `</tbody></table></div>`;
    }
    html += `<p style="text-align:center">إجمالي الإلغاءات: ${currentEntries.length}</p></body></html>`;
    
    const blob = new Blob([html], { type: 'application/msword' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `تقرير_الالغاءات_${getTodayKey()}.doc`;
    link.click();
    URL.revokeObjectURL(link.href);
    showToast('✅ تم تصدير التقرير', false);
  };
  
  window.copyAllToClipboard = function() {
    if (currentEntries.length === 0) {
      showToast('لا توجد بيانات', true);
      return;
    }
    
    let text = `📊 تقرير الإلغاءات - ${getTodayKey()}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
    const grouped = {};
    currentEntries.forEach(e => {
      if (!grouped[e.branch]) grouped[e.branch] = [];
      grouped[e.branch].push(e);
    });
    
    for (const [branch, entries] of Object.entries(grouped)) {
      text += `🏪 ${branch}\n`;
      text += `┌─────┬──────────┬────────────────┬──────────────┐\n`;
      text += `│  #  │ الأوردر  │   رقم الزبون   │    السبب     │\n`;
      text += `├─────┼──────────┼────────────────┼──────────────┤\n`;
      entries.forEach((e, i) => {
        text += `│ ${(i+1).toString().padEnd(3)} │ ${e.order.padEnd(8)} │ ${(e.phone || '—').padEnd(14)} │ ${e.reason.padEnd(12)} │\n`;
      });
      text += `└─────┴──────────┴────────────────┴──────────────┘\n\n`;
    }
    text += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📦 إجمالي الإلغاءات: ${currentEntries.length}`;
    
    navigator.clipboard.writeText(text);
    showToast('✅ تم نسخ كل الإلغاءات', false);
  };
  
  window.clearAllData = function() {
    if (confirm('⚠️ هل أنت متأكد من حذف كل البيانات؟')) {
      saveLocal([]);
      if (database) {
        database.ref(`cancellations/${getTodayKey()}`).remove();
      }
      showToast('✅ تم حذف كل البيانات', false);
    }
  };
  
  // Initialize Firebase
  try {
    firebase.initializeApp(firebaseConfig);
    database = firebase.database();
    console.log("✅ Firebase initialized");
    setSyncStatus('synced');
  } catch(e) {
    console.error("Firebase init error:", e);
    setSyncStatus('error');
  }
  
  // Load local data
  currentEntries = loadLocal();
  updateCounter();
  
  // Listen for online/offline
  window.addEventListener('online', () => {
    isOnline = true;
    showToast('🌐 عاد الاتصال بالإنترنت', false);
    setTimeout(() => window.syncFromCloud(), 1000);
  });
  
  window.addEventListener('offline', () => {
    isOnline = false;
    setSyncStatus('error');
    showToast('⚠️ لا يوجد اتصال بالإنترنت', true);
  });
  
  // Auto sync after 5 seconds
  setTimeout(() => {
    if (database && navigator.onLine) {
      window.syncFromCloud();
    }
  }, 5000);
</script>

<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js"></script>

</body>
</html>
