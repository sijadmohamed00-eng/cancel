<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: monospace;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
    }

    .copy-container {
      display: flex;
      align-items: center;
      font-size: 24px;
      letter-spacing: 1px;
    }

    p {
      margin: 0;
      white-space: pre;
    }

    .handle {
      width: 10px;
      height: 22px;
      background-color: #fff;
      display: inline-block;
      margin-left: 5px;
      animation: blink 0.6s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="copy-container center-xy">
      <p id="quote"></p>
      <span class="handle"></span>
    </div>
  </div>

  <script>
    const text = "404, page not found.";
    const quoteElement = document.getElementById("quote");

    let i = 0;

    function typeWriter() {
      if (i < text.length) {
        quoteElement.textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, 100); // سرعة كتابة كل حرف
      } else {
        // الانتظار لمدة ثانيتين بعد اكتمال النص ثم إعادة الحركة من جديد
        setTimeout(resetAndPlay, 2000); 
      }
    }

    function resetAndPlay() {
      quoteElement.textContent = "";
      i = 0;
      typeWriter();
    }

    // تشغيل الحركة تلقائياً لأول مرة
    resetAndPlay();
  </script>

</body>
</html>
