<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الإلغاءات</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Tahoma', Arial, sans-serif;
    background: #10132a;
    color: #eee;
    width: 165px;
    overflow: hidden;
    user-select: none;
  }

  /* تصغير المسافات */
  .header {
    background: linear-gradient(135deg, #1B52C4, #0d3a8a);
    padding: 4px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: move;
  }

  .header-title { 
    font-size: 9px; 
    font-weight: 700; 
    display: flex;
    align-items: center;
    gap: 3px;
  }
  
  .pin-btn {
    background: transparent;
    border: none;
    color: #fff;
    cursor: pointer;
    font-size: 10px;
    padding: 0 3px;
    opacity: 0.7;
  }
  .pin-btn.active { 
    opacity: 1; 
    color: #f59e0b; 
  }
  .pin-btn:hover { opacity: 1; }

  .body {
    padding: 4px 5px 4px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  label {
    font-size: 8px;
    color: #4A9EFF;
    font-weight: 600;
    display: block;
    margin-bottom: 1px;
  }

  input, select {
    width: 100%;
    background: #0a1228;
    border: 1px solid #1B52C444;
    border-radius: 3px;
    color: #fff;
    font-size: 9px;
    padding: 3px 4px;
    outline: none;
    font-family: inherit;
    direction: rtl;
  }

  input:focus, select:focus { border-color: #4A9EFF; }

  select option { background: #0a1228; }

  .custom-reason { display: none; margin-top: 2px; }
  .custom-reason.visible { display: block; }
  .custom-reason input { font-size: 8px; padding: 2px 3px; }

  .btn-send {
    width: 100%;
    background: linear-gradient(135deg, #1B52C4, #4A9EFF);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 5px;
    font-size: 9px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 2px;
  }

  .btn-send:active { opacity: 0.8; }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

  .counter {
    text-align: center;
    font-size: 8px;
    color: #4A9EFF99;
    padding: 2px 0 0 0;
  }

  .sync-status {
    text-align: center;
    font-size: 7px;
    padding: 1px 0;
    cursor: pointer;
  }
  .sync-status.synced { color: #16a34a; }
  .sync-status.error { color: #ef4444; }

  .admin-btn {
    background: transparent;
    color: #f59e0b;
    border: 1px solid #f59e0b55;
    border-radius: 4px;
    padding: 3px;
    font-size: 8px;
    cursor: pointer;
    width: 100%;
    margin-top: 3px;
  }

  .toast {
    position: fixed;
    bottom: 3px;
    left: 3px;
    right: 3px;
    background: #16a34a;
    font-size: 8px;
    text-align: center;
    padding: 3px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 9999;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: #dc2626; }

  hr { margin: 2px 0; border: none; border-top: 1px solid #1B52C422; }
  
  /* Admin Panel */
  .admin-panel {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #0a0e1aee;
    backdrop-filter: blur(5px);
    z-index: 10000;
    padding: 10px;
  }
  .admin-panel.show { display: block; }
  .admin-content {
    background: #10132a;
    border-radius: 10px;
    padding: 10px;
    border: 1px solid #4A9EFF;
  }
  .admin-content h3 { font-size: 12px; margin-bottom: 8px; color: #4A9EFF; }
  .admin-content button {
    background: #1B52C4;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 5px 8px;
    margin: 3px;
    cursor: pointer;
    font-size: 10px;
  }
  .admin-content .close-btn { background: #dc2626; }
  .admin-password {
    width: 100%;
    padding: 5px;
    margin: 6px 0;
    background: #0a1228;
    border: 1px solid #1B52C4;
    border-radius: 4px;
    color: #fff;
    font-size: 10px;
  }
</style>
</head>
<body>

<div class="header" id="drag-handle">
  <div class="header-title">
    <span>🚫</span>
    <span>تسجيل إلغاء</span>
  </div>
  <div>
    <button class="pin-btn" id="pinBtn" onclick="toggleAlwaysOnTop()" title="تثبيت فوق النوافذ">📌</button>
  </div>
</div>

<div class="body">
  <div>
    <label>📦 رقم الأوردر</label>
    <input type="text" id="order-num" placeholder="284" inputmode="numeric">
  </div>
  <div>
    <label>📞 رقم الزبون</label>
    <input type="text" id="phone-num" placeholder="07xxxxxxxxx" inputmode="tel">
  </div>
  <div>
    <label>🏪 الفرع</label>
    <select id="branch">
      <option value="">اختر</option>
      <option>فرع الشعب</option>
      <option>فرع البنوك</option>
      <option>فرع الغدير</option>
      <option>فرع الحرية</option>
      <option>فرع الدورة</option>
      <option>فرع بسماية</option>
      <option>فرع الغزالية</option>
      <option>فرع الأعظمية</option>
      <option>فرع حي العامل</option>
      <option>فرع البوعيثة</option>
      <option>فرع حي الجهاد</option>
      <option>فرع شهداء البياع</option>
    </select>
  </div>
  <div>
    <label>❌ سبب الإلغاء</label>
    <select id="reason" onchange="toggleCustom()">
      <option value="">اختر</option>
      <option>زبون</option>
      <option>تكرار</option>
      <option>تحويل</option>
      <option>عدم رد</option>
      <option>خارج الزون</option>
      <option value="مخصص">مخصص ✏️</option>
    </select>
    <div class="custom-reason" id="custom-wrap">
      <input type="text" id="custom-reason-txt" placeholder="سبب...">
    </div>
  </div>
  <hr>
  <button class="btn-send" onclick="sendEntry()">📋 حفظ + نسخ</button>
  <div class="counter" id="counter">الإلغاءات: 0</div>
  <div class="sync-status" id="sync-status" onclick="syncFromCloud()">☁️ متزامن</div>
  <button class="admin-btn" onclick="showAdminPanel()">👑 أدمن</button>
</div>

<div class="toast" id="toast">✅ تم الحفظ!</div>

<div id="adminPanel" class="admin-panel">
  <div class="admin-content">
    <h3>👑 لوحة الأدمن</h3>
    <input type="password" id="adminPass" class="admin-password" placeholder="كلمة المرور">
    <button onclick="checkAdmin()">🔓 دخول</button>
    <div id="adminActions" style="display: none; margin-top: 8px;">
      <button onclick="generateWordReport()">📄 تقرير Word</button>
      <button onclick="copyAllToClipboard()">📋 نسخ الكل</button>
      <button onclick="clearAllData()" style="background:#dc2626;">⚠️ حذف الكل</button>
      <hr style="margin:5px 0">
      <button onclick="closeAdminPanel()" class="close-btn">❌ إغلاق</button>
    </div>
  </div>
</div>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCBnLWtMPJBHF55yCZvjZJu34LMtTxc1u0",
    authDomain: "cansel-9df25.firebaseapp.com",
    projectId: "cansel-9df25",
    databaseURL: "https://cansel-9df25-default-rtdb.firebaseio.com/"
  };

  let database;
  let currentEntries = [];
  let alwaysOnTopWindow = null;
  let isPinned = false;

  function getTodayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function loadLocal() {
    try {
      const key = `cancel_${getTodayKey()}`;
      const saved = localStorage.getItem(key);
      currentEntries = saved ? JSON.parse(saved) : [];
      updateCounter();
    } catch(e) { currentEntries = []; }
  }

  function saveLocal() {
    try {
      const key = `cancel_${getTodayKey()}`;
      localStorage.setItem(key, JSON.stringify(currentEntries));
      sessionStorage.setItem('current_cancel_entries', JSON.stringify(currentEntries));
    } catch(e) {}
  }

  function updateCounter() {
    document.getElementById('counter').textContent = `الإلغاءات: ${currentEntries.length}`;
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    if (isError) t.classList.add('error');
    else t.classList.remove('error');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1500);
  }

  function setSyncStatus(status) {
    const el = document.getElementById('sync-status');
    if (status === 'synced') {
      el.textContent = '☁️ متزامن';
      el.classList.add('synced');
      el.classList.remove('error');
    } else if (status === 'error') {
      el.textContent = '⚠️ غير متزامن';
      el.classList.add('error');
      el.classList.remove('synced');
    }
  }

  // Always on Top - فتح نافذة منفصلة تبقى فوق الجميع
  window.toggleAlwaysOnTop = function() {
    const pinBtn = document.getElementById('pinBtn');
    
    if (!isPinned) {
      // فتح نافذة جديدة مصغرة وتبقى فوق الجميع
      const win = window.open(window.location.href, 'CancelAppWindow', 
        'width=180,height=420,toolbar=no,menubar=no,location=no,status=no,scrollbars=no,resizable=no');
      
      if (win) {
        alwaysOnTopWindow = win;
        isPinned = true;
        pinBtn.classList.add('active');
        pinBtn.textContent = '📍';
        showToast('📌 تم فتح نافذة مثبتة', false);
        
        // محاولة جعلها فوق الجميع (لن تعمل في كل المتصفحات)
        if (win.moveTo) {
          win.moveTo(100, 100);
        }
        win.focus();
      } else {
        showToast('⚠️ السماح بالنوافذ المنبثقة', true);
      }
    } else {
      // إغلاق النافذة المنبثقة
      if (alwaysOnTopWindow && !alwaysOnTopWindow.closed) {
        alwaysOnTopWindow.close();
      }
      isPinned = false;
      pinBtn.classList.remove('active');
      pinBtn.textContent = '📌';
      showToast('تم إلغاء التثبيت', false);
    }
  };

  window.toggleCustom = function() {
    const sel = document.getElementById('reason');
    document.getElementById('custom-wrap').classList.toggle('visible', sel.value === 'مخصص');
  };

  async function saveToFirebase(entry) {
    if (!database) return false;
    try {
      const path = `cancellations/${getTodayKey()}/${entry.id}`;
      await database.ref(path).set(entry);
      return true;
    } catch(e) { return false; }
  }

  window.sendEntry = async function() {
    const order = document.getElementById('order-num').value.trim();
    const phone = document.getElementById('phone-num').value.trim();
    const branch = document.getElementById('branch').value;
    const reasonSelect = document.getElementById('reason');
    let reason = reasonSelect.value;
    
    if (reason === 'مخصص') {
      reason = document.getElementById('custom-reason-txt').value.trim();
    }
    
    if (!order) { showToast('⚠️ رقم الأوردر مطلوب', true); return; }
    if (!branch) { showToast('⚠️ الفرع مطلوب', true); return; }
    if (!reason) { showToast('⚠️ السبب مطلوب', true); return; }
    
    const now = new Date();
    const timeStr = now.toLocaleTimeString('ar-IQ', {hour:'2-digit', minute:'2-digit'});
    
    const entry = {
      id: Date.now(),
      order: order,
      phone: phone || '',
      branch: branch,
      reason: reason,
      time: timeStr,
      date: getTodayKey(),
      createdAt: now.getTime()
    };
    
    // حفظ محلياً
    currentEntries.push(entry);
    saveLocal();
    updateCounter();
    
    // رفع للسحابة
    const uploaded = await saveToFirebase(entry);
    setSyncStatus(uploaded ? 'synced' : 'error');
    
    // نسخ للحافظة
    const msg = `🚫 إلغاء أوردر\n📦 رقم الأوردر: ${order}\n${phone ? `📞 رقم الزبون: ${phone}\n` : ''}🏪 الفرع: ${branch}\n❌ السبب: ${reason}\n⏰ الوقت: ${timeStr}`;
    
    try {
      await navigator.clipboard.writeText(msg);
      showToast(`✅ تم حفظ ${order}`, false);
    } catch(e) {
      const ta = document.createElement('textarea');
      ta.value = msg;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(`✅ تم حفظ ${order}`, false);
    }
    
    // مسح الحقول
    document.getElementById('order-num').value = '';
    document.getElementById('phone-num').value = '';
    document.getElementById('branch').value = '';
    document.getElementById('reason').value = '';
    document.getElementById('custom-reason-txt').value = '';
    document.getElementById('custom-wrap').classList.remove('visible');
    document.getElementById('order-num').focus();
  };

  window.syncFromCloud = async function() {
    if (!database) return;
    try {
      const snapshot = await database.ref(`cancellations/${getTodayKey()}`).once('value');
      if (snapshot.exists()) {
        const data = snapshot.val();
        const cloudEntries = Object.values(data);
        cloudEntries.sort((a,b) => a.id - b.id);
        
        // دمج البيانات
        const merged = [...currentEntries];
        cloudEntries.forEach(ce => {
          if (!merged.find(e => e.id === ce.id)) {
            merged.push(ce);
          }
        });
        merged.sort((a,b) => a.id - b.id);
        currentEntries = merged;
        saveLocal();
        updateCounter();
        setSyncStatus('synced');
      }
    } catch(e) {
      setSyncStatus('error');
    }
  };

  // Admin Functions
  window.showAdminPanel = function() {
    document.getElementById('adminPanel').classList.add('show');
  };
  
  window.closeAdminPanel = function() {
    document.getElementById('adminPanel').classList.remove('show');
    document.getElementById('adminActions').style.display = 'none';
    document.getElementById('adminPass').value = '';
  };
  
  window.checkAdmin = function() {
    const pass = document.getElementById('adminPass').value;
    if (pass === 'admin123') {
      document.getElementById('adminActions').style.display = 'block';
      showToast('✅ مرحباً أيها الأدمن', false);
    } else {
      showToast('❌ كلمة المرور غير صحيحة', true);
    }
  };
  
  window.generateWordReport = function() {
    if (currentEntries.length === 0) {
      showToast('لا توجد بيانات', true);
      return;
    }
    
    const grouped = {};
    currentEntries.forEach(entry => {
      if (!grouped[entry.branch]) grouped[entry.branch] = [];
      grouped[entry.branch].push(entry);
    });
    
    let html = `<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>تقرير الإلغاءات</title>
    <style>body{font-family:Arial;margin:20px;}h1{color:#1B52C4;text-align:center;}
    .branch{margin-bottom:30px;border:1px solid #ddd;border-radius:8px;}
    .branch h2{background:#1B52C4;color:white;padding:8px;margin:0;}
    table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ddd;padding:6px;text-align:center;}
    th{background:#f0f0f0;}</style></head>
    <body><h1>شركة عصر الشرق</h1><h3 style="text-align:center">تقرير الإلغاءات</h3>
    <p style="text-align:center">التاريخ: ${new Date().toLocaleDateString('ar-IQ')}</p>`;
    
    for (const [branch, entries] of Object.entries(grouped)) {
      entries.sort((a,b) => a.id - b.id);
      html += `<div class="branch"><h2>🏪 ${branch} (${entries.length})</h2>
      <table><thead><tr><th>#</th><th>رقم الأوردر</th><th>رقم الزبون</th><th>السبب</th></tr></thead><tbody>`;
      entries.forEach((e, i) => {
        html += `<tr><td>${i+1}</td><td>${e.order}</td><td dir="ltr">${e.phone || '—'}</td><td>${e.reason}</td></tr>`;
      });
      html += `</tbody></table></div>`;
    }
    html += `<p style="text-align:center">إجمالي الإلغاءات: ${currentEntries.length}</p></body></html>`;
    
    const blob = new Blob([html], { type: 'application/msword' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `تقرير_الالغاءات_${getTodayKey()}.doc`;
    link.click();
    URL.revokeObjectURL(link.href);
    showToast('✅ تم تصدير التقرير', false);
  };
  
  window.copyAllToClipboard = function() {
    if (currentEntries.length === 0) {
      showToast('لا توجد بيانات', true);
      return;
    }
    
    let text = `📊 تقرير الإلغاءات - ${getTodayKey()}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
    const grouped = {};
    currentEntries.forEach(e => {
      if (!grouped[e.branch]) grouped[e.branch] = [];
      grouped[e.branch].push(e);
    });
    
    for (const [branch, entries] of Object.entries(grouped)) {
      text += `🏪 ${branch}\n`;
      text += `┌─────┬──────────┬────────────────┬──────────────┐\n`;
      text += `│  #  │ الأوردر  │   رقم الزبون   │    السبب     │\n`;
      text += `├─────┼──────────┼────────────────┼──────────────┤\n`;
      entries.forEach((e, i) => {
        text += `│ ${(i+1).toString().padEnd(3)} │ ${e.order.padEnd(8)} │ ${(e.phone || '—').padEnd(14)} │ ${e.reason.padEnd(12)} │\n`;
      });
      text += `└─────┴──────────┴────────────────┴──────────────┘\n\n`;
    }
    text += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📦 إجمالي الإلغاءات: ${currentEntries.length}`;
    
    navigator.clipboard.writeText(text);
    showToast('✅ تم نسخ الكل', false);
  };
  
  window.clearAllData = function() {
    if (confirm('⚠️ حذف كل البيانات؟')) {
      currentEntries = [];
      saveLocal();
      if (database) {
        database.ref(`cancellations/${getTodayKey()}`).remove();
      }
      updateCounter();
      showToast('✅ تم حذف البيانات', false);
    }
  };

  // تهيئة Firebase
  try {
    firebase.initializeApp(firebaseConfig);
    database = firebase.database();
    setSyncStatus('synced');
    
    // استماع للتحديثات
    database.ref(`cancellations/${getTodayKey()}`).on('value', (snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.val();
        const cloudEntries = Object.values(data);
        cloudEntries.sort((a,b) => a.id - b.id);
        
        let changed = false;
        if (cloudEntries.length !== currentEntries.length) {
          changed = true;
        } else {
          for (let i = 0; i < cloudEntries.length; i++) {
            if (cloudEntries[i].id !== currentEntries[i].id) {
              changed = true;
              break;
            }
          }
        }
        
        if (changed) {
          currentEntries = cloudEntries;
          saveLocal();
          updateCounter();
        }
      }
    });
  } catch(e) {
    setSyncStatus('error');
  }
  
  // تحميل البيانات المحلية
  loadLocal();
  
  // مزامنة أولية
  setTimeout(() => {
    if (database && navigator.onLine) {
      window.syncFromCloud();
    }
  }, 2000);
</script>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

</body>
</html>
