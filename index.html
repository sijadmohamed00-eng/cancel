<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: monospace;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .container {
      text-align: center;
    }

    .copy-container {
      display: flex;
      align-items: center;
      font-size: 24px;
      letter-spacing: 1px;
    }

    p {
      margin: 0;
      white-space: pre;
    }

    .handle {
      width: 10px;
      height: 22px;
      background-color: #fff;
      display: inline-block;
      margin-left: 5px;
      animation: blink 0.6s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    #cb-replay {
      fill: #fff;
      width: 22px;
      height: 22px;
      position: absolute;
      top: 20px;
      right: 20px;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s ease, transform 0.3s ease;
    }

    #cb-replay:hover {
      opacity: 1;
      transform: rotate(180deg);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="copy-container center-xy">
      <p id="quote"></p>
      <span class="handle"></span>
    </div>
  </div>

  <svg version="1.1" id="cb-replay" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
       viewBox="0 0 279.9 297.3" style="enable-background:new 0 0 279.9 297.3;" xml:space="preserve">
    <g>
      <path d="M269.4,162.6c-2.7,66.5-55.6,120.1-121.8,123.9c-77,4.4-141.3-60-136.8-136.9C14.7,81.7,71,27.8,140,27.8
        c1.8,0,3.5,0,5.3,0.1c0.3,0,0.5,0.2,0.5,0.5v15c0,1.5,1.6,2.4,2.9,1.7l35.9-20.7c1.3-0.7,1.3-2.6,0-3.3L148.6,0.3
        c-1.3-0.7-2.9,0.2-2.9,1.7v15c0,0.3-0.2,0.5-0.5,0.5c-1.7-0.1-3.5-0.1-5.2-0.1C63.3,17.3,1,78.9,0,155.4
        C-1,233.8,63.4,298.3,141.9,297.3c74.6-1,135.1-60.2,138-134.3c0.1-3-2.3-5.4-5.3-5.4l0,0C271.8,157.6,269.5,159.8,269.4,162.6z"/>
    </g>
  </svg>

  <script>
    const text = "404, page not found.";
    const quoteElement = document.getElementById("quote");
    const replayBtn = document.getElementById("cb-replay");

    let i = 0;
    let timer;

    function typeWriter() {
      if (i < text.length) {
        quoteElement.textContent += text.charAt(i);
        i++;
        timer = setTimeout(typeWriter, 100);
      }
    }

    function resetAndPlay() {
      clearTimeout(timer);
      quoteElement.textContent = "";
      i = 0;
      typeWriter();
    }

    // بدء الحركة مباشرة عند فتح الصفحة
    resetAndPlay();

    // إعادة الحركة عند الضغط على زر الإعادة (Replay)
    replayBtn.addEventListener("click", resetAndPlay);
  </script>

</body>
</html>
