<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الإلغاءات</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #10132a;
    color: #eee;
    width: 160px;
    overflow: hidden;
    user-select: none;
  }
  .header {
    background: linear-gradient(135deg, #1B52C4, #0d3a8a);
    padding: 5px 7px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #4A9EFF33;
  }
  .header-title { font-size: 10px; font-weight: 700; color: #fff; }
  .body {
    padding: 6px 6px 5px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  label {
    font-size: 9px;
    color: #4A9EFF;
    font-weight: 600;
    display: block;
    margin-bottom: 1px;
  }
  input[type="text"], select {
    width: 100%;
    background: #0a1228;
    border: 1px solid #1B52C444;
    border-radius: 4px;
    color: #fff;
    font-size: 10.5px;
    padding: 4px 5px;
    outline: none;
    font-family: inherit;
    direction: rtl;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus, select:focus { border-color: #4A9EFF; }
  select option { background: #0a1228; }
  .custom-reason { display: none; margin-top: 3px; }
  .custom-reason.visible { display: block; }
  .btn-send {
    width: 100%;
    background: linear-gradient(135deg, #1B52C4, #4A9EFF);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 6px;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 2px;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-send:active:not(:disabled) { opacity: 0.8; }
  .btn-report {
    width: 100%;
    background: transparent;
    color: #4A9EFF;
    border: 1px solid #4A9EFF55;
    border-radius: 5px;
    padding: 4px;
    font-size: 9.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-report:hover { background: #4A9EFF11; }
  .counter {
    text-align: center;
    font-size: 9px;
    color: #4A9EFF99;
    padding: 1px 0;
  }
  .status {
    text-align: center;
    font-size: 8.5px;
    padding: 2px 0;
    border-radius: 3px;
  }
  .status.connecting { color: #f59e0b; }
  .status.connected  { color: #22c55e; }
  .status.error      { color: #ef4444; }
  .toast {
    position: fixed;
    bottom: 5px;
    left: 4px;
    right: 4px;
    color: #fff;
    font-size: 10px;
    text-align: center;
    padding: 5px 4px;
    border-radius: 5px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 99;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: #16a34a; }
  .toast.fail    { background: #dc2626; }
  hr { border: none; border-top: 1px solid #1B52C422; margin: 2px 0; }
</style>
</head>
<body>

<div class="header">
  <span class="header-title">🚫 تسجيل إلغاء</span>
  <span style="font-size:10px">☁️</span>
</div>

<div class="body">
  <div class="status connecting" id="status">⏳ جاري الاتصال...</div>

  <div>
    <label>رقم الأوردر *</label>
    <input type="text" id="order-num" placeholder="مثال: 284" inputmode="numeric">
  </div>

  <div>
    <label>رقم الزبون</label>
    <input type="text" id="phone-num" placeholder="07xxxxxxxxx" inputmode="tel">
  </div>

  <div>
    <label>الفرع *</label>
    <select id="branch">
      <option value="">— اختر الفرع —</option>
      <option>فرع الشعب</option>
      <option>فرع البنوك</option>
      <option>فرع الغدير</option>
      <option>فرع الحرية</option>
      <option>فرع الدورة</option>
      <option>فرع بسماية</option>
      <option>فرع الغزالية</option>
      <option>فرع الأعظمية</option>
      <option>فرع حي العامل</option>
      <option>فرع البوعيثة</option>
      <option>فرع حي الجهاد</option>
      <option>فرع شهداء البياع</option>
    </select>
  </div>

  <div>
    <label>سبب الإلغاء *</label>
    <select id="reason" onchange="toggleCustom()">
      <option value="">— اختر السبب —</option>
      <option>زبون</option>
      <option>تكرار</option>
      <option>تحويل</option>
      <option>عدم رد</option>
      <option>خارج الزون</option>
      <option value="مخصص">مخصص ✏️</option>
    </select>
    <div class="custom-reason" id="custom-wrap">
      <input type="text" id="custom-reason-txt" placeholder="اكتب السبب...">
    </div>
  </div>

  <hr>

  <button class="btn-send" id="btn-send" onclick="sendEntry()" disabled>📋 حفظ + نسخ للواتساب</button>
  <div class="counter" id="counter">الإلغاءات اليوم: —</div>
  <button class="btn-report" onclick="openReport()">📊 فتح التقرير</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, query, where,
    getDocs, onSnapshot, serverTimestamp, Timestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCBnLWtMPJBHF55yCZvjZJu34LMtTxc1u0",
    authDomain: "cansel-9df25.firebaseapp.com",
    projectId: "cansel-9df25",
    storageBucket: "cansel-9df25.firebasestorage.app",
    messagingSenderId: "1056776938370",
    appId: "1:1056776938370:web:79c3d830fc2f37debfa59b"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const col = collection(db, "cancellations");

  const statusEl  = document.getElementById('status');
  const counterEl = document.getElementById('counter');
  const btnSend   = document.getElementById('btn-send');

  // ─── Live counter: today's entries ───────────────────────────
  function getTodayRange() {
    const start = new Date();
    start.setHours(0, 0, 0, 0);
    const end = new Date();
    end.setHours(23, 59, 59, 999);
    return {
      start: Timestamp.fromDate(start),
      end:   Timestamp.fromDate(end)
    };
  }

  try {
    const { start, end } = getTodayRange();
    const q = query(col,
      where("createdAt", ">=", start),
      where("createdAt", "<=", end)
    );

    onSnapshot(q, (snap) => {
      counterEl.textContent = `الإلغاءات اليوم: ${snap.size}`;
      statusEl.textContent  = '🟢 متصل';
      statusEl.className    = 'status connected';
      btnSend.disabled      = false;
    }, (err) => {
      statusEl.textContent = '🔴 خطأ في الاتصال';
      statusEl.className   = 'status error';
      console.error(err);
    });
  } catch(e) {
    statusEl.textContent = '🔴 خطأ في الاتصال';
    statusEl.className   = 'status error';
  }

  // ─── Helpers ─────────────────────────────────────────────────
  window.toggleCustom = function() {
    const sel = document.getElementById('reason');
    document.getElementById('custom-wrap').classList.toggle('visible', sel.value === 'مخصص');
  };

  window.openReport = function() {
    window.open('report.html', '_blank', 'width=820,height=620');
  };

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent  = msg;
    t.className    = `toast show ${type}`;
    setTimeout(() => t.className = 'toast', 2400);
  }

  // ─── Save to Firestore + copy ─────────────────────────────────
  window.sendEntry = async function() {
    const order  = document.getElementById('order-num').value.trim();
    const phone  = document.getElementById('phone-num').value.trim();
    const branch = document.getElementById('branch').value;
    const selEl  = document.getElementById('reason');
    const reason = selEl.value === 'مخصص'
      ? document.getElementById('custom-reason-txt').value.trim()
      : selEl.value;

    if (!order || !branch || !reason) {
      showToast('⚠️ رقم الأوردر والفرع والسبب مطلوبة', 'fail');
      return;
    }

    btnSend.disabled = true;
    btnSend.textContent = '⏳ جاري الحفظ...';

    try {
      await addDoc(col, {
        order,
        phone:     phone || null,
        branch,
        reason,
        createdAt: serverTimestamp()
      });

      // Build WhatsApp message
      const now     = new Date();
      const timeStr = now.toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' });
      const msg =
        `🚫 إلغاء أوردر\n` +
        `📦 رقم الأوردر: ${order}\n` +
        (phone ? `📞 رقم الزبون: ${phone}\n` : '') +
        `🏪 الفرع: ${branch}\n` +
        `❌ السبب: ${reason}\n` +
        `⏰ الوقت: ${timeStr}`;

      try {
        await navigator.clipboard.writeText(msg);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = msg;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }

      showToast('✅ تم الحفظ والنسخ!', 'success');

      // Reset
      document.getElementById('order-num').value = '';
      document.getElementById('phone-num').value  = '';
      document.getElementById('branch').value      = '';
      selEl.value = '';
      document.getElementById('custom-reason-txt').value = '';
      document.getElementById('custom-wrap').classList.remove('visible');
      document.getElementById('order-num').focus();

    } catch (err) {
      showToast('❌ فشل الحفظ — تحقق من الاتصال', 'fail');
      console.error(err);
    } finally {
      btnSend.disabled    = false;
      btnSend.textContent = '📋 حفظ + نسخ للواتساب';
    }
  };
</script>

</body>
</html>
