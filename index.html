<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الإلغاءات</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #10132a;
    color: #eee;
    width: 160px;
    overflow: hidden;
    user-select: none;
  }

  .header {
    background: linear-gradient(135deg, #1B52C4, #0d3a8a);
    padding: 5px 7px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: move;
    border-bottom: 1px solid #4A9EFF33;
  }

  .header-title { font-size: 10px; font-weight: 700; color: #fff; }

  .body {
    padding: 6px 6px 5px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  label {
    font-size: 9px;
    color: #4A9EFF;
    font-weight: 600;
    display: block;
    margin-bottom: 1px;
  }

  input[type="text"], select {
    width: 100%;
    background: #0a1228;
    border: 1px solid #1B52C444;
    border-radius: 4px;
    color: #fff;
    font-size: 10.5px;
    padding: 4px 5px;
    outline: none;
    font-family: inherit;
    direction: rtl;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus, select:focus { border-color: #4A9EFF; }

  select option { background: #0a1228; }

  .custom-reason { display: none; margin-top: 3px; }
  .custom-reason.visible { display: block; }

  .btn-send {
    width: 100%;
    background: linear-gradient(135deg, #1B52C4, #4A9EFF);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 6px;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 2px;
    font-family: inherit;
    transition: opacity 0.15s;
  }

  .btn-send:active { opacity: 0.8; }

  .btn-report {
    width: 100%;
    background: transparent;
    color: #4A9EFF;
    border: 1px solid #4A9EFF55;
    border-radius: 5px;
    padding: 4px;
    font-size: 9.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-report:hover { background: #4A9EFF11; }

  .counter {
    text-align: center;
    font-size: 9px;
    color: #4A9EFF99;
    padding: 1px 0;
  }

  .toast {
    position: fixed;
    bottom: 5px;
    left: 4px;
    right: 4px;
    background: #16a34a;
    color: #fff;
    font-size: 10px;
    text-align: center;
    padding: 5px 4px;
    border-radius: 5px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 99;
  }

  .toast.show { opacity: 1; }

  hr { border: none; border-top: 1px solid #1B52C422; margin: 2px 0; }
</style>
</head>
<body>

<div class="header" id="drag-handle">
  <span class="header-title">🚫 تسجيل إلغاء</span>
  <span style="font-size:10px">📋</span>
</div>

<div class="body">

  <div>
    <label>رقم الأوردر *</label>
    <input type="text" id="order-num" placeholder="مثال: 284" inputmode="numeric">
  </div>

  <div>
    <label>رقم الزبون</label>
    <input type="text" id="phone-num" placeholder="07xxxxxxxxx" inputmode="tel">
  </div>

  <div>
    <label>الفرع *</label>
    <select id="branch">
      <option value="">— اختر الفرع —</option>
      <option>فرع الشعب</option>
      <option>فرع البنوك</option>
      <option>فرع الغدير</option>
      <option>فرع الحرية</option>
      <option>فرع الدورة</option>
      <option>فرع بسماية</option>
      <option>فرع الغزالية</option>
      <option>فرع الأعظمية</option>
      <option>فرع حي العامل</option>
      <option>فرع البوعيثة</option>
      <option>فرع حي الجهاد</option>
      <option>فرع شهداء البياع</option>
    </select>
  </div>

  <div>
    <label>سبب الإلغاء *</label>
    <select id="reason" onchange="toggleCustom()">
      <option value="">— اختر السبب —</option>
      <option>زبون</option>
      <option>تكرار</option>
      <option>تحويل</option>
      <option>عدم رد</option>
      <option>خارج الزون</option>
      <option value="مخصص">مخصص ✏️</option>
    </select>
    <div class="custom-reason" id="custom-wrap">
      <input type="text" id="custom-reason-txt" placeholder="اكتب السبب...">
    </div>
  </div>

  <hr>

  <button class="btn-send" onclick="sendEntry()">📋 حفظ + نسخ للواتساب</button>
  <div class="counter" id="counter">الإلغاءات اليوم: 0</div>
  <button class="btn-report" onclick="openReport()">📊 فتح التقرير</button>

</div>

<div class="toast" id="toast">✅ تم الحفظ والنسخ!</div>

<script>
  const STORAGE_KEY = 'cancel_entries_v1';

  function getTodayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }

  function load() {
    try {
      const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      return all[getTodayKey()] || [];
    } catch { return []; }
  }

  function save(entries) {
    try {
      const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      all[getTodayKey()] = entries;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    } catch {}
  }

  function updateCounter() {
    document.getElementById('counter').textContent = `الإلغاءات اليوم: ${load().length}`;
  }

  function toggleCustom() {
    const sel = document.getElementById('reason');
    document.getElementById('custom-wrap').classList.toggle('visible', sel.value === 'مخصص');
  }

  function sendEntry() {
    const order  = document.getElementById('order-num').value.trim();
    const phone  = document.getElementById('phone-num').value.trim();
    const branch = document.getElementById('branch').value;
    const sel    = document.getElementById('reason');
    const reason = sel.value === 'مخصص'
      ? document.getElementById('custom-reason-txt').value.trim()
      : sel.value;

    if (!order || !branch || !reason) {
      alert('⚠️ رقم الأوردر والفرع والسبب مطلوبة');
      return;
    }

    // Save entry
    const entries = load();
    const now = new Date();
    const timeStr = now.toLocaleTimeString('ar-IQ', {hour:'2-digit', minute:'2-digit'});
    const entry = {
      id: Date.now(),
      order,
      phone,
      branch,
      reason,
      time: timeStr
    };
    entries.push(entry);
    save(entries);

    // Build WhatsApp message
    const msg =
      `🚫 إلغاء أوردر\n` +
      `📦 رقم الأوردر: ${order}\n` +
      (phone ? `📞 رقم الزبون: ${phone}\n` : '') +
      `🏪 الفرع: ${branch}\n` +
      `❌ السبب: ${reason}\n` +
      `⏰ الوقت: ${timeStr}`;

    // Copy to clipboard
    const copy = (text) => {
      if (navigator.clipboard) {
        return navigator.clipboard.writeText(text);
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return Promise.resolve();
    };

    copy(msg).then(() => {
      showToast();
      updateCounter();
      // Reset fields
      document.getElementById('order-num').value = '';
      document.getElementById('phone-num').value = '';
      document.getElementById('branch').value = '';
      document.getElementById('reason').value = '';
      document.getElementById('custom-reason-txt').value = '';
      document.getElementById('custom-wrap').classList.remove('visible');
      document.getElementById('order-num').focus();
    }).catch(() => { showToast(); updateCounter(); });
  }

  function openReport() {
    window.open('report.html', '_blank', 'width=800,height=600');
  }

  function showToast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  updateCounter();
</script>

</body>
</html>
