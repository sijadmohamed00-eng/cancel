<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقرير الإلغاءات</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #fff;
    color: #000;
    padding: 20px;
    direction: rtl;
  }
  .container { max-width: 100%; margin: 0 auto; }
  .report-header {
    text-align: center;
    margin-bottom: 30px;
    border-bottom: 2px solid #000;
    padding-bottom: 15px;
  }
  .report-header h1 { font-size: 22px; margin-bottom: 5px; }
  .report-header h3 { font-size: 16px; font-weight: normal; margin-bottom: 5px; }
  .report-header p { font-size: 14px; color: #555; }
  .controls {
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    background: #f5f5f5;
    padding: 12px 15px;
    border-radius: 8px;
  }
  .controls input {
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 13px;
    flex: 1;
    min-width: 150px;
  }
  .controls button {
    padding: 8px 16px;
    background: #1B52C4;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
  }
  .btn-export { background: #dc2626 !important; }
  .btn-print { background: #16a34a !important; }
  .branch-section {
    margin-bottom: 35px;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
  }
  .branch-header {
    background: #1B52C4;
    color: white;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .branch-header h2 { font-size: 16px; margin: 0; }
  .branch-count {
    background: #f59e0b;
    color: #000;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
  }
  .branch-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .branch-table th, .branch-table td {
    border: 1px solid #ddd;
    padding: 8px 10px;
    text-align: center;
  }
  .branch-table th {
    background: #f0f0f0;
    font-weight: bold;
  }
  .footer {
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    color: #666;
    border-top: 1px solid #ddd;
    padding-top: 15px;
  }
  @media print {
    .controls { display: none; }
    .branch-section { break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="report-header">
    <h1>شركة عصر الشرق</h1>
    <h3>لإدارة المطاعم</h3>
    <h3>قسم خدمة العملاء</h3>
    <p>التاريخ: <span id="report-date"></span></p>
    <hr>
  </div>

  <div class="controls">
    <input type="text" id="search-input" placeholder="🔍 بحث برقم الأوردر أو رقم الزبون...">
    <button onclick="loadData()" id="refreshBtn">🔄 تحديث</button>
    <button onclick="exportToWord()" class="btn-export">📄 تصدير Word</button>
    <button onclick="window.print()" class="btn-print">🖨️ طباعة</button>
  </div>

  <div id="branches-container"></div>

  <div class="footer">
    آخر تحديث: <span id="last-update">-</span>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCBnLWtMPJBHF55yCZvjZJu34LMtTxc1u0",
    authDomain: "cansel-9df25.firebaseapp.com",
    projectId: "cansel-9df25",
    databaseURL: "https://cansel-9df25-default-rtdb.firebaseio.com/"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let allEntries = [];

  const branchesOrder = [
    "فرع الشعب", "فرع البنوك", "فرع الغدير", "فرع الحرية",
    "فرع الدورة", "فرع بسماية", "فرع الغزالية", "فرع الأعظمية",
    "فرع حي العامل", "فرع البوعيثة", "فرع حي الجهاد", "فرع شهداء البياع"
  ];

  function getTodayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function displayDate() {
    const now = new Date();
    const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
    document.getElementById('report-date').textContent = dateStr;
  }

  function renderBranches() {
    const searchText = document.getElementById('search-input').value.toLowerCase();
    let filtered = allEntries;
    
    if (searchText) {
      filtered = allEntries.filter(e => 
        e.order.toLowerCase().includes(searchText) || 
        e.phone.toLowerCase().includes(searchText)
      );
    }
    
    const grouped = {};
    branchesOrder.forEach(branch => { grouped[branch] = []; });
    filtered.forEach(entry => {
      if (grouped[entry.branch]) {
        grouped[entry.branch].push(entry);
      } else {
        grouped[entry.branch] = [entry];
      }
    });
    
    const container = document.getElementById('branches-container');
    let html = '';
    let totalCancellations = 0;
    
    for (const branch of branchesOrder) {
      const entries = grouped[branch];
      if (entries.length > 0) {
        totalCancellations += entries.length;
        entries.sort((a, b) => a.id - b.id);
        
        html += `
          <div class="branch-section">
            <div class="branch-header">
              <h2>🏪 ${branch}</h2>
              <span class="branch-count">${entries.length} إلغاء</span>
            </div>
            <table class="branch-table">
              <thead>
                <tr>
                  <th style="width:50px">#</th>
                  <th>رقم الأوردر</th>
                  <th>رقم الزبون</th>
                  <th>السبب</th>
                </tr>
              </thead>
              <tbody>
        `;
        
        for (let idx = 0; idx < entries.length; idx++) {
          const entry = entries[idx];
          html += `
            <tr>
              <td>${idx + 1}</td>
              <td><strong>${entry.order}</strong></td>
              <td dir="ltr">${entry.phone || '—'}</td>
              <td>${entry.reason}</td>
            </tr>
          `;
        }
        
        html += `
              </tbody>
            </table>
          </div>
        `;
      }
    }
    
    if (totalCancellations === 0) {
      html = '<div style="text-align:center; padding:50px; background:#f5f5f5; border-radius:10px;">📭 لا توجد إلغاءات مسجلة اليوم</div>';
    }
    
    container.innerHTML = html;
    document.getElementById('last-update').textContent = new Date().toLocaleTimeString('ar-IQ');
  }

  function loadData() {
    const refreshBtn = document.getElementById('refreshBtn');
    refreshBtn.textContent = '⏳ جاري...';
    
    database.ref(`cancellations/${getTodayKey()}`).once('value').then((snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.val();
        allEntries = Object.entries(data).map(([id, entry]) => ({
          id: parseInt(id),
          order: entry.order || '-',
          phone: entry.phone || '-',
          branch: entry.branch || '-',
          reason: entry.reason || '-',
        }));
      } else {
        const saved = sessionStorage.getItem('current_cancel_entries');
        allEntries = saved ? JSON.parse(saved) : [];
      }
      
      renderBranches();
      refreshBtn.textContent = '🔄 تحديث';
      
    }).catch(err => {
      console.error("Load error:", err);
      const saved = sessionStorage.getItem('current_cancel_entries');
      allEntries = saved ? JSON.parse(saved) : [];
      renderBranches();
      refreshBtn.textContent = '🔄 تحديث';
    });
  }

  window.loadData = loadData;

  function exportToWord() {
    if (allEntries.length === 0) {
      alert('لا توجد بيانات للتصدير');
      return;
    }
    
    const grouped = {};
    branchesOrder.forEach(branch => { grouped[branch] = []; });
    allEntries.forEach(entry => {
      if (grouped[entry.branch]) {
        grouped[entry.branch].push(entry);
      } else {
        grouped[entry.branch] = [entry];
      }
    });
    
    const today = getTodayKey();
    const now = new Date();
    const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
    
    let html = `<!DOCTYPE html>
    <html dir="rtl">
    <head>
      <meta charset="UTF-8">
      <title>تقرير الإلغاءات - ${today}</title>
      <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 30px; background: white; color: black; direction: rtl; }
        .report-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #000; padding-bottom: 15px; }
        .report-header h1 { font-size: 22px; margin-bottom: 5px; color: #1B52C4; }
        .report-header h3 { font-size: 16px; font-weight: normal; margin-bottom: 5px; }
        .report-header p { font-size: 14px; color: #555; }
        .branch-section { margin-bottom: 35px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; page-break-inside: avoid; }
        .branch-header { background: #1B52C4; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .branch-header h2 { font-size: 16px; margin: 0; }
        .branch-count { background: #f59e0b; color: #000; padding: 3px 10px; border-radius: 20px; font-size: 12px; }
        .branch-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .branch-table th, .branch-table td { border: 1px solid #ddd; padding: 8px 10px; text-align: center; }
        .branch-table th { background: #f0f0f0; }
        .footer { margin-top: 30px; text-align: center; font-size: 12px; color: #666; border-top: 1px solid #ddd; padding-top: 15px; }
      </style>
    </head>
    <body>
      <div class="report-header">
        <h1>شركة عصر الشرق</h1>
        <h3>لإدارة المطاعم</h3>
        <h3>قسم خدمة العملاء</h3>
        <p>التاريخ: ${dateStr}</p>
        <hr>
      </div>
    `;
    
    for (const branch of branchesOrder) {
      const entries = grouped[branch];
      if (entries.length > 0) {
        entries.sort((a, b) => a.id - b.id);
        html += `
          <div class="branch-section">
            <div class="branch-header">
              <h2>🏪 ${branch}</h2>
              <span class="branch-count">${entries.length} إلغاء</span>
            </div>
            <table class="branch-table">
              <thead>
                <tr>
                  <th style="width:50px">#</th>
                  <th>رقم الأوردر</th>
                  <th>رقم الزبون</th>
                  <th>السبب</th>
                </tr>
              </thead>
              <tbody>
        `;
        entries.forEach((entry, idx) => {
          html += `
            <tr>
              <td>${idx + 1}</td>
              <td>${entry.order}</td>
              <td dir="ltr">${entry.phone || '—'}</td>
              <td>${entry.reason}</td>
            </tr>
          `;
        });
        html += `
              </tbody>
            </table>
          </div>
        `;
      }
    }
    
    html += `
      <div class="footer">
        <p>إجمالي الإلغاءات: ${allEntries.length}</p>
        <p>تم التصدير بتاريخ: ${new Date().toLocaleString('ar-IQ')}</p>
      </div>
    </body>
    </html>`;
    
    const blob = new Blob([html], { type: 'application/msword' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `تقرير_الالغاءات_${today}.doc`;
    link.click();
    URL.revokeObjectURL(link.href);
  }
  
  window.exportToWord = exportToWord;

  function listenToRealtime() {
    const todayKey = getTodayKey();
    database.ref(`cancellations/${todayKey}`).on('value', (snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.val();
        allEntries = Object.entries(data).map(([id, entry]) => ({
          id: parseInt(id),
          order: entry.order || '-',
          phone: entry.phone || '-',
          branch: entry.branch || '-',
          reason: entry.reason || '-',
        }));
        renderBranches();
      }
    });
  }

  document.getElementById('search-input').addEventListener('input', renderBranches);
  
  displayDate();
  listenToRealtime();
  loadData();
</script>
</body>
</html>
